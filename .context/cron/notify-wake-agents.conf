# T-3068 — declared wake consumers for scripts/notify-wake-supervisor.sh.
#
# PATH A of the wake rail: the sidecar raises notify/<agent>.flag, and a consumer
# declared here polls it and acts. Before this file nothing read the flag at all —
# mail landed in a mailbox and nobody was woken (PL-168 at the wake layer).
#
# Format: <agent-id> [topic-filter|-] [extra consumer flags...]
#   <agent-id>      whose flag to watch; the consumer also acts AS this identity,
#                   so its L3 stage=read receipts are signed by the right agent.
#   [topic-filter]  only fire on this topic, or '-' for any.
#
# Only agents listed here are supervised. That is deliberate and mirrors the
# sidecar conf: ~/.termlink/notify still holds July test residue (s3g, s3probe,
# s3smoke, s3t*), and a supervisor that adopted every flag it found would
# resurrect dead test agents forever — the permanently-red guard nobody reads
# (T-2818).
#
# NOT listed, on purpose:
#   claude-termlink     — its flag carries 91 pending from stale July topics, so a
#                         consumer would fire immediately and continuously on
#                         history rather than on new mail. Sweep that backlog
#                         first; a wake that fires on everything wakes nobody.
#
# claude-termlink-alt: the per-agent identity (6738c073bbcc587a). Clean mailbox,
# so its wakes are real ones.
claude-termlink-alt - --as-identity claude-termlink

# framework-agent-systemd: the AEF agent. It CANNOT run termlink inside its own
# session (not in --allowed-commands), but this consumer runs on the host and acts
# on its behalf under its identity — so the AEF agent gets a working L3 rung
# without widening its sandbox. That separation is the point.
framework-agent-systemd - --as-identity framework-agent-systemd
