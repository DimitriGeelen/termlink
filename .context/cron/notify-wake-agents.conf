# T-3068 — declared wake consumers for scripts/notify-wake-supervisor.sh.
#
# PATH A of the wake rail: the sidecar raises notify/<agent>.flag, and a consumer
# declared here polls it and acts. Before this file nothing read the flag at all —
# mail landed in a mailbox and nobody was woken (PL-168 at the wake layer).
#
# Format: <agent-id> [topic-filter|-] [extra consumer flags...]
#   <agent-id>      whose flag to watch; the consumer also acts AS this identity,
#                   so its L3 stage=read receipts are signed by the right agent.
#   [topic-filter]  only fire on this topic, or '-' for any.
#
# Only agents listed here are supervised. That is deliberate and mirrors the
# sidecar conf: ~/.termlink/notify still holds July test residue (s3g, s3probe,
# s3smoke, s3t*), and a supervisor that adopted every flag it found would
# resurrect dead test agents forever — the permanently-red guard nobody reads
# (T-2818).
#
# NOT listed, on purpose:
#   claude-termlink     — STILL EXCLUDED, but the original reason below has expired
#                         and the prescribed remedy does not work. Read this before
#                         acting on it (T-3206, measured 2026-09-28).
#
#                         Original reason, kept for the record:
#                           "its flag carries 91 pending from stale July topics, so a
#                            consumer would fire immediately and continuously on
#                            history rather than on new mail. Sweep that backlog
#                            first; a wake that fires on everything wakes nobody."
#
#                         What is actually true now. Of its 95 pending, the July test
#                         residue (acp-probe, deadbeef, s3t1, s3t2) is FOUR messages.
#                         The rest is real mail: 50 AEF consults on
#                         inbox:cacc73ea32b121dd/010-termlink, 13 from
#                         framework-agent-systemd, 12 from fd794e5408011572, and more.
#                         A consumer here would mostly fire on genuine mail, so the
#                         "fires on history" premise no longer holds.
#
#                         Why it stays excluded anyway — a different, harder blocker.
#                         Sweeping the backlog (the remedy above) CANNOT clear it while
#                         T-3065 stands: claude-termlink's sidecar records an ack guard
#                         at offset 49 on the inbox topic, yet
#                         `channel unread --sender d1993c2c3ec44c94` there still returns
#                         50, and the only receipts on that topic carry senders
#                         3bba15e681b3a078 and 6738c073bbcc587a — never d1993c2c3ec44c94.
#                         The ack does not register under the identity whose cursor is
#                         measured. So pending can never reach 0, so write_cycle keeps
#                         re-stamping last_mail_ts every cycle (`if pending > 0`), so a
#                         consumer fires forever regardless of how clean the backlog is.
#                         Same end state the original note feared, different cause.
#
#                         Precondition to lift this: fix T-3065, confirm pending can
#                         reach 0, THEN add the line. Do not sweep first and expect it
#                         to hold — it will not, and you will lose the time to a
#                         correct-sounding instruction whose premise expired.
#
# claude-termlink-alt: the per-agent identity (6738c073bbcc587a). Clean mailbox,
# so its wakes are real ones.
claude-termlink-alt - --as-identity claude-termlink

# framework-agent-systemd: the AEF agent. It CANNOT run termlink inside its own
# session (not in --allowed-commands), but this consumer runs on the host and acts
# on its behalf under its identity — so the AEF agent gets a working L3 rung
# without widening its sandbox. That separation is the point.
framework-agent-systemd - --as-identity framework-agent-systemd
