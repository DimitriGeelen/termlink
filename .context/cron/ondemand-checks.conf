# ondemand-checks.conf — canaries that are deliberately NOT cron-backed (T-2688).
#
# `scripts/canary-status.sh` (the /canaries verb, T-2172) auto-discovers every
# `.context/working/.*-canary.log` AND synthesizes one from every
# `.*-canary.heartbeat`, then grades each on heartbeat freshness. That grading is
# meaningful only for a check something runs on a schedule. The entries below are
# ad-hoc, source-level static checks — CLAUDE.md documents each as "a source-level
# static check ... NOT a runtime cron canary", and the T-2561 cron-install-drift
# check confirms none of them has (or should have) a crontab. Grading them on
# heartbeat age pinned /canaries at "4 stale" forever, so it could never report a
# healthy tree and its exit code carried no signal.
#
# Semantics — registration suppresses STALENESS ONLY:
#   * empty log + aged heartbeat  -> ON_DEMAND  (not counted as a problem)
#   * log with findings           -> FIRING     (unchanged; still exit 1)
# An on-demand check that found something is exactly as actionable as a cron one.
# Registration is never a way to silence findings.
#
# Format: one canary name per line (the `<name>` in `.<name>.log` /
# `.<name>.heartbeat`). Blank lines and `#` comments ignored.
#
# Before adding an entry, ask whether the check SHOULD be on a cron instead — this
# file is for checks whose design is ad-hoc, not for canaries whose cron install was
# forgotten (that is what `scripts/check-cron-install-drift.sh` catches).

# T-2527 — unclamped caller-param -> allocation-sink scanner. Source-level grep/AST-lite
# static check over the handler crates; run ad-hoc after touching an allocation sink.
alloc-sink-canary

# T-2531 — unbounded peer-driven drain-sink scanner. Sibling of T-2527 for the
# accumulation half of the class; same ad-hoc, source-level tier.
drain-sink-canary

# T-2666 — silent non-zero-exit scanner over the user-facing CLI crate. Static check
# for the charter's Directive #2 (no silent failures); no runtime component to schedule.
silent-exit-canary

# T-2672 — long-poll busy-spin scanner. Static check for a sleep-on-error backoff in
# long-poll loops; brace-matched source analysis, nothing to poll on a schedule.
busy-spin-canary
