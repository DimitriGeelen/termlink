# T-3050 — declared notify-sidecar agents for scripts/notify-sidecar-supervisor.sh
# (G-069 / PL-168 prevention for the arc-003 deterministic wake rail).
#
# Format: <agent-id> <self-fp | ->
#   <self-fp>  the identity fingerprint whose dm:<self>:* topics are this agent's mail.
#              Get it from `termlink agent identity`.
#   -          let the sidecar resolve identity itself via `termlink whoami --json`.
#
# DECLARE THE FINGERPRINT unless you know whoami is unambiguous on the host.
# T-3049 measured `termlink whoami` returning ambiguous:true across 18 candidate
# sessions here, so the sidecar's own resolution cannot settle it and a sidecar
# started without --self-fp would poll nothing while still looking alive.
#
# Only agents listed here are supervised, and only these are the ones a liveness
# canary should fire on. That is deliberate: ~/.termlink/notify/ still holds July
# test residue (s3g, s3probe, s3smoke, s3t*), and a supervisor that adopted every
# stale heartbeat it found would resurrect dead test agents forever — the
# permanently-red guard nobody reads (T-2818).

# --auto-confirm (T-3053): mirror each unread dm topic into the journal and post a
# mechanism-A receipt (stage=delivered, up_to=<offset>) with NO LLM turn, guarded by
# a durable per-topic offset so it cannot ack-spam. Without it no receipt is ever
# written, so a sender using `--await-ack --retry` exhausts its retries and
# dead-letters a message that actually arrived — measured: 27 messages in on one
# peer topic, receipts empty. The claim is deliberately narrow: stage=delivered
# asserts the transport delivered it and the journal holds it, NOT that an agent
# read or understood it.
claude-termlink d1993c2c3ec44c94 --auto-confirm

# T-3054 — the AEF agent. It registers with its OWN identity key
# (--identity-key /root/.termlink/identities/framework-agent-systemd.key), so its
# fingerprint is 3bba15e681b3a078, NOT the shared host key d1993c2c3ec44c94. Its
# mail therefore lives on different dm: topics and the claude-termlink sidecar
# above does not cover it. Derived via
#   TERMLINK_AGENT_ID=framework-agent-systemd termlink agent identity --resolve --json
# rather than guessed from topic names.
#
# It is a long-lived registered shell endpoint under systemd (roles framework,pickup),
# i.e. exactly the always-on peer the deterministic rail exists for.
framework-agent-systemd 3bba15e681b3a078 --auto-confirm

# T-3061 — THE SECOND MAILBOX. `claude-termlink` has TWO fingerprints on this host:
# d1993c2c3ec44c94 is the shared HOST key (declared above, carries 11 of 16 live
# dm: topics), and 6738c073bbcc587a is its PER-AGENT key at
# identities/claude-termlink.key, which is what
#   TERMLINK_AGENT_ID=claude-termlink termlink agent identity --resolve
# actually returns. Any peer that resolves the agent id — rather than copying the
# host key out of an old topic name — addresses the per-agent fingerprint.
#
# PROVEN SILENT LOSS, with a control: a topic dm:3bba15e681b3a078:6738c073bbcc587a
# was created and posted to (offset=0). The PEER's sidecar consumed it and posted a
# receipt up_to=0. OUR sidecar never moved — pending stayed 89, latest_topic
# unchanged, across two full 15s cycles. Same message, same hub, same second; the
# only variable was the configured fingerprint.
#
# This line ADDS coverage rather than migrating it. Pointing the existing entry at
# the per-agent key would strand the 11 topics that carry real traffic today, so
# both mailboxes are watched until the operator decides which identity is canonical
# (the AEF unit's own comments argue per-agent, since a shared host key makes
# attribution forgeable — but that is a decision, not a default).
#
# Detected by: bash scripts/notify-rail-e2e.sh --experiment e4
claude-termlink-alt 6738c073bbcc587a --auto-confirm
