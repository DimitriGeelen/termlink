# T-3050 — declared notify-sidecar agents for scripts/notify-sidecar-supervisor.sh
# (G-069 / PL-168 prevention for the arc-003 deterministic wake rail).
#
# Format: <agent-id> <self-fp | ->
#   <self-fp>  the identity fingerprint whose dm:<self>:* topics are this agent's mail.
#              Get it from `termlink agent identity`.
#   -          let the sidecar resolve identity itself via `termlink whoami --json`.
#
# DECLARE THE FINGERPRINT unless you know whoami is unambiguous on the host.
# T-3049 measured `termlink whoami` returning ambiguous:true across 18 candidate
# sessions here, so the sidecar's own resolution cannot settle it and a sidecar
# started without --self-fp would poll nothing while still looking alive.
#
# Only agents listed here are supervised, and only these are the ones a liveness
# canary should fire on. That is deliberate: ~/.termlink/notify/ still holds July
# test residue (s3g, s3probe, s3smoke, s3t*), and a supervisor that adopted every
# stale heartbeat it found would resurrect dead test agents forever — the
# permanently-red guard nobody reads (T-2818).

# --auto-confirm (T-3053): mirror each unread dm topic into the journal and post a
# mechanism-A receipt (stage=delivered, up_to=<offset>) with NO LLM turn, guarded by
# a durable per-topic offset so it cannot ack-spam. Without it no receipt is ever
# written, so a sender using `--await-ack --retry` exhausts its retries and
# dead-letters a message that actually arrived — measured: 27 messages in on one
# peer topic, receipts empty. The claim is deliberately narrow: stage=delivered
# asserts the transport delivered it and the journal holds it, NOT that an agent
# read or understood it.
claude-termlink d1993c2c3ec44c94 --auto-confirm
