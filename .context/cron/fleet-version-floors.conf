# T-2359 — declared per-hub version floors for check-fleet-binary-freshness.sh
# (G-069 prevention). Format: <hub-name-from-hubs.toml> <min-version | ->
#   <min-version>  fire when the hub SERVES below this (in-memory process, not disk)
#   -              exempt: foreign build lineage or expected-transient host
# Optional `* <min-version>` row applies to undeclared hubs.
#
# BUMP THE FLOOR WHEN HUB-SIDE RAILS SHIP: that is the operator's declaration
# that "shipped" must mean "capability-live" — the canary then names lagging
# hubs daily until they are restarted onto the new binary. Patch numbers are
# commits-since-tag and are NOT comparable across build lineages — never set
# a floor for a hub whose binary you don't build.

# Our lineage. T-2466 (2026-07-27): upgraded the local .107 systemd hub
# (serves both these profiles — one process on /var/lib/termlink/hub.secret)
# 0.11.635 → 0.11.679 via `systemctl restart termlink-hub` after installing the
# fresh musl binary to /root/.cargo/bin/termlink. Floor bumped to the running
# version so a restart onto an older binary fires the canary.
# (0.11.324 previously carried the T-2355 walk-deadline rails.)
# T-2720 (2026-08-15): BUMPED 0.11.679 → 0.11.871 WITHOUT a deploy — deliberately.
# Every prior bump in this file recorded a version already running. This one does
# the opposite: it declares the floor the fleet SHOULD be at so the canary starts
# naming the hubs that are not. T-2533 (`ac859d321`, 2026-08-08, v0.11.871) fixed
# SILENT DATA LOSS on `unread`/`ack` — pre-fix hubs do not serve `latest_offset`,
# so clients fall back to `count-1` and can report 0 unread while messages sit
# unseen on a swept topic. The floor was not bumped when it shipped, so this canary
# read `served=0.11.720 >= floor=0.11.679` = healthy for 7 days while the whole
# fleet ran the bug. A peer session re-discovered the symptom and filed it as new
# (T-2719). 0.11.871 is the MINIMUM carrying the fix, not HEAD — asking for more
# than the fix requires would make the floor an opinion again. Re-bump to the
# deployed version once these hosts are actually upgraded (that is an operator
# action: install the binary, then restart THROUGH the systemd unit per G-070).
# T-2762 (2026-08-16): 0.11.871 → 0.11.1411 — these hosts were ACTUALLY upgraded.
# The .107 systemd hub (one process serving both profiles) went 0.11.720 → 0.11.1411
# via `systemctl restart termlink-hub` after installing the fresh musl binary, with
# the TLS fingerprint and secret hash captured either side and confirmed identical
# (no PL-021 rotation). This bump is the T-2720 kind repaid: that floor was an
# ASPIRATION (declared above the running version to make the canary name laggards);
# this one records reality again. Leaving it at 0.11.871 would mean a restart onto
# any binary from 0.11.871 up — including the 691-commit-stale one we just replaced —
# reads healthy, which is the exact G-069 blindness this file exists to prevent.
local-test 0.11.1411
workstation-107-public 0.11.1411

