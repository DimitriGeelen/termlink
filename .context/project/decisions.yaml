  - id: PD-172
    decision: "for the four scripts that install their own cleanup `trap ... EXIT` later in the file (check-fleet-doorbell-mail-health, check-forever-archival-freshness, check-topic-growth-freshness, substrate-preflight), use a SELF-GUARDING helper armed early and CHAINED onto that later trap. `trap ... EXIT` replaces any previous EXIT trap, so a naive second trap at the heartbeat site would have been silently overwritten by the cleanup trap below it — stopping those four heartbeats entirely and pinning four canaries permanently STALE, a worse failure than the one being fixed and invisible until someone read /canaries a day later. Rejected moving the heartbeat into the cleanup trap only: that leaves an early exit-2, before the cleanup trap is installed, with no heartbeat at all."
