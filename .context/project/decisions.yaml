    decision: T-233 Specialist Orchestration — layered agent routing with bypass registry, route cache, negotiation,
      and template caching
    scope: project
    origin_task: T-233
    rationale: 'GO decision after comprehensive inception. Five architectural principles: bypass-first (sub-50ms),
      lazy learning, format negotiation, trust-aware supervision, zero-config defaults. Child tasks T-239-T-242, T-256
      are building blocks — never evaluate them as isolated features.'
    directives_served:
    - D1
    - D3
    - D4
