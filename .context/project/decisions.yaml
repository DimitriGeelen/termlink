  - id: PD-251
    decision: "both, by topic. `inbox:<id>` and `dm:<a>:<b>` are delivered. The WS subscribes to their wake event (`inbox.queued` / `dm.queued`) and keeps only events whose `payload.channel` is this topic. Each such event triggers a durable fetch from the cursor that prints the envelopes (`[push] <topic> offset=N sender: payload`). The backlog is fetched first, and a fetch also runs every 30 s as a safety net. Every other channel topic (`agent-presence`, `framework:pickup`, ...) is refused at once, before any hub contact, with a hint naming `--follow` and the event topics. Hub event topics (dotted with no `:`, or a `*` pattern) keep today's behaviour, so the pushwaker's `inbox.queued --push` / `dm.queued --push` are untouched."
    scope: project
    date: 2026-10-20
