id: arc-010
slug: arc-011
name: "Agent-to-agent message delivery: mailbox to prompt"
description: "The operator's full spec for the sidecar rail, end to end: sender -> sidecar API\
  \ -> receiver stores message+blob on local disk -> flag -> RECEIVED back to sender\
  \ -> sender ledger -> independent cron checks the prompt is free -> queue -> inject\
  \ -> verify the agent is working -> INJECTED back to sender -> roles swap on reply.\
  \ Steps 1-6 are partly built on the wrong mechanism (hub RPC, not a sidecar API);\
  \ steps 7-10 do not exist."
status: in-progress
anchor_task: T-3069
headline_mechanic: "An agent sends a message (with an optional binary blob) to a peer and learns, as\
  \ two separate confirmed events, that it was RECEIVED into the peer's local store\
  \ and later INJECTED into the peer's prompt with the peer verified as working on\
  \ it \u2014 without either side needing to be continuously attached."
demo_evidence: null
created: 2026-09-22T13:10:11Z
closed_at: null
decision: null
# T-1918 (arc-006, value-prioritisation): BVP scoring fields. Semantics in
# docs/reports/T-1915-bvp-inception.md §4 (D7-reframe) and §7 (M2).
bvp_scores: {}
scoped_drivers: []           # max 3, weight ≤6 each (M2). Approved by fw arc approve-driver (T-1926).
proposed_scoped_drivers: []  # uncapped persistence (D7-reframe). Estimator may write here freely.

# T-3066 — this arc carries a SLICE REGISTER and a PROVER BINDING, which no other
# arc in this repo has. Both exist because of what went wrong on arc-003:
#   * arc-003 closed asserting "no silent loss" and a silent-loss path was proven
#     82 days later. Its only evidence was demo_evidence — a markdown narrative
#     written once at close time, which cannot fail later.
#   * a deferred slice (L3 stage=read) had no field to live in, so it survived only
#     as the word "future" inside a task that completed, and vanished.
# A slice with no task is now a structural query, not an archaeology exercise.
# scripts/check-arc-claim-drift.sh runs the prover and fires if it stops passing.
prover: "bash scripts/notify-rail-e2e.sh --stages precond,deliver,receipt,ladder,wake"

# Each slice maps to ONE operator spec step. status: built | partial | unbuilt.
# 'partial' means something real exists but NOT via the specified mechanism — it is
# deliberately not 'built', because that is exactly the overclaim that wasted a day.
slices:
  - id: S1
    spec_step: "1. sender sends via a sidecar API"
    task: T-3075
    status: unbuilt
    note: "Sends ride hub RPC today. No sidecar API exists. Operator wants a separate
           always-respawning process, independent of the hub because the hub goes
           down, also carrying the startup chain (agent/session/project/hub, re-resolve
           FQDN/IP on change). NEEDS OPERATOR DISCUSSION BEFORE BUILD."
  - id: S2
    spec_step: "2. payload may carry a binary blob"
    task: T-3076
    status: unbuilt
    note: "REFINED 2026-09-22 (T-3076). Blob-on-a-topic exists END TO END:
           `artifact.put` + `channel.post {msg_type:artifact, artifact_ref:<sha256>}`
           (T-1249/T-1164a), content-addressed. The session-targeted
           file.init/chunk/complete path is the LEGACY FALLBACK, used only when a
           peer hub does not advertise artifact.put.
           THE ACTUAL GAP, measured: there is NO `termlink artifact` subcommand,
           so a SHELL SCRIPT can post --artifact-ref but cannot move the BYTES.
           put/get are reachable only from inside file send/receive. Remediation
           is two thin CLI wrappers over functions that already exist. That is
           new CLI surface, hence a SOVEREIGN question (T-3076 IW-2), parked."
  - id: S3
    spec_step: "3. receiver stores it on local disk"
    task: T-2300
    status: built
    note: "journal.sqlite, 2238 rows measured 2026-09-22."
  - id: S4
    spec_step: "4. receiver sets a flag"
    task: T-3068
    status: built
    note: "Plus the arrival record (last_mail_ts/last_mail_topic) that survives the
           L2 ack, so the flag can answer 'did anything arrive since I last looked?'
           rather than only 'is something unread right now'."
  - id: S5
    spec_step: "5. receiver tells sender RECEIVED"
    task: T-2300
    status: partial
    note: "L2 stage=delivered is real and durable, but it is a POST TO A HUB TOPIC,
           not a sidecar API call. Right event, wrong mechanism. Becomes 'built' when
           S1 lands."
  - id: S6
    spec_step: "6. sender records it in its own ledger"
    task: T-3070
    status: built
    note: "scripts/notify-ledger.sh — one outbox row per message sent, carrying the
           rung it reached (sent | delivered | read). Survives a restart, so the
           sender no longer has to re-poll every topic it has ever used to answer
           'what am I still waiting on?'. 15 hermetic fixtures.
           TWO INTEGRITY RULES carry the whole value: a rung NEVER advances without
           a receipt actually read back (absence is shown as absence, never assumed
           to be progress), and a stage=read receipt carrying the WITHDRAWN
           evidence=wake-consumer is ignored — such receipts exist on live topics
           today (offset 110 on dm:3bba15e681b3a078:d1993c2c3ec44c94) and honouring
           them would relaunder a retracted claim as fact.
           Its first live sync earned its keep immediately: both messages to the AEF
           agent read 'delivered' and NEITHER 'read'. 'Delivered but never read' is
           now a state the sender can SEE rather than an absence it must notice."
  - id: S7
    spec_step: "7. independent process checks the prompt is free"
    task: T-3069
    status: unbuilt
    note: "The READY/BUSY/UNKNOWN classifier exists (be-reachable-pushwaker, T-2402
           Stage 3) and is WIRED TO NOTHING. Must run without an LLM online, and must
           have a recovery path when the agent is not running at all."
  - id: S8
    spec_step: "8. read the queue, inject the highest-priority message"
    task: T-3071
    status: built
    note: "The field was never missing from the wire — journal-mirror.sh was DISCARDING
           it. It parsed every envelope's metadata and kept exactly two keys
           (conversation_id, observed_addr); payload holds the decoded BODY, not the
           envelope, so once dropped nothing downstream could recover it. A sender could
           have declared a priority for months and it would have vanished silently.
           Now persisted to messages.priority, CLAMPED to [-9,9] on the way in
           (T-2527 caller-param convention: priority arrives from a PEER, and unclamped
           `priority: 1e9` pins that sender to the head of every queue forever — a denial
           of attention needing no exploit, just a large integer). bool is excluded
           deliberately (bool subclasses int in Python, so `true` would have become band
           1); unparseable sorts as NORMAL, never as urgent.
           Injector now orders COALESCE(priority,0) DESC, ts ASC, offset ASC. Flat stays
           flat — it stopped being INCIDENTAL. Before this there was no declared notion
           of priority for the ordering to be flat with respect to, so the guarantee
           lived only in a comment.
           BEHAVIOUR-PRESERVING, differentially proven on the real corpus: 2241 rows,
           143 topics, identical row selected on every topic. That identity is
           meaningful because the clause was separately shown load-bearing — promoting
           the NEWEST message on a live topic to band 5 flips selection from offset 0 to
           20. 23 injector fixtures (17 pre-existing intact, and they now double as the
           pre-migration back-compat assertion since their queue has no priority column)
           + 16 NEW journal-mirror fixtures — the mirror had no coverage at all before
           it began writing peer-supplied input into a column the injector sorts on.
           DOES NOT authorise S9: bypassing the prompt-free wait remains blocked on SQ-4."
  - id: S9
    spec_step: "9. urgent messages inject directly"
    task: T-3072
    status: unbuilt
    note: "Semantics undefined. Operator: note it for later."
  - id: S10
    spec_step: "10. inject, verify the agent is working, report INJECTED"
    task: T-3069
    status: unbuilt
    note: "CODE COMPLETE, NOT PROVEN (T-3069). scripts/notify-injector.sh runs the
           full chain with five distinct outcomes and 17 hermetic fixtures, and it
           behaves correctly live UP TO the prompt check (rc=4 defer on a real
           session). The inject->verify->L3 path is UNPROVEN and the AC is
           unticked.
           BLOCKER, measured twice: there is no live interactive Claude REPL
           registered as a TermLink session on this host. All 14 sessions classify
           UNKNOWN because they are shell endpoints or finished dispatch workers at
           a bash prompt. THE INJECTOR HAS NO AUDIENCE YET — which is a fleet
           condition, not a code defect, and it also means S12 (role swap) rests on
           an assumption nothing currently satisfies."
  - id: S11
    spec_step: "11. a cron drives the whole loop"
    task: T-3068
    status: unbuilt
    note: "Crontab written, NOT installed. WAKE reports NOT-WIRED and that verdict is
           correct until it is in."
  - id: S12
    spec_step: "12. roles swap — the agent replies as sender"
    task: T-3075
    status: unbuilt
    note: "Blocked for framework-agent-systemd: `termlink` is not in its systemd
           --allowed-commands, so it can receive and cannot reply. Operator decision."

# Raised during execution, unresolved, in priority order. The mandate's binding is
# that these are SURFACED, not resolved to keep momentum.
sovereign_questions:
  - id: SQ-1
    question: "Does the injector belong to AEF rather than TermLink?"
    task: T-3075
    why: "Charter non-goal 4 disclaims orchestration; queue -> inject -> verify IS
           orchestration. Decides which repo T-3069 lives in. Asked the AEF agent
           directly; no reply yet."
  - id: SQ-2
    question: "Given NO interactive Claude REPL is registered as a TermLink session,
               should the arc prioritise making agents INJECTABLE before building
               more injection machinery?"
    task: T-3069
    why: "Measured 2026-09-22: all 14 registered sessions classify UNKNOWN because
           they are shell endpoints or finished dispatch workers. S10 and S12 both
           assume an audience that does not currently exist. T-2389 (arm agents via
           tl-claude --reachable, owner:human) may be the real blocker for the whole
           arc, ranking above T-3071/T-3072."
  - id: SQ-3
    question: "Add `termlink artifact put` / `artifact get` CLI verbs?"
    task: T-3076
    why: "Two thin wrappers over existing functions, but new CLI surface on a project
           that pruned 52 tools in P4."
  - id: SQ-4
    question: "What does an URGENT message do when the prompt is BUSY?"
    task: T-3072
    why: "Injecting into a busy prompt is the T-2396 failure — text lands unsubmitted
           and is discarded. So urgent-into-busy can silently lose exactly the
           messages most likely to be marked urgent. Blocks T-3072."
  - id: SQ-5
    question: "Install the wake-supervisor crontab when the only live proof of the
               wake path has been withdrawn?"
    task: T-3068
    why: "RAISED 2026-09-22 during the T-3071 run. The audit has one standing FAIL —
           cron(notify-wake-supervisor) written but absent from /etc/cron.d — and it
           has been left deliberately uninstalled across two sessions. The reason got
           sharper on inspection: T-3068's live-proof AC was ticked citing offsets
           107-110 with `evidence=wake-consumer`, and that evidence kind was withdrawn
           as untruthful later the same day (a consumer noticing a FLAG has injected
           nothing, so `stage=read` on that basis asserts a read that never happened).
           notify-ack-read.sh dropped it from the valid list and notify-ledger.sh
           refuses to advance a rung on it, naming offset 110 — the very receipt cited
           — in its fixtures as the case to ignore. The AC has now been UNTICKED.
           So the question is not merely 'install it?' but: scheduling a cron to drive
           a path whose only end-to-end proof has been retracted wires up machinery
           nothing has shown to work. Against that, leaving it uninstalled keeps a
           permanent red in the audit, which is its own corrosion (T-2818: a guard
           that is always red stops being read).
           Operator call. Two coherent answers: (a) install it and accept that the
           rail's proof is pending a valid-evidence receipt, or (b) leave it dark and
           acknowledge the audit FAIL in writing so the red is explained rather than
           ignored. Not decided here — deciding it to keep momentum is exactly what
           the mandate forbids.
           MEASURED COST OF (b), added 2026-09-22 after T-3078 triage: leaving it dark
           is NOT free and is no longer just one audit line. check-cron-install-drift
           reports it as the single MISSING crontab (SHIPPED BUT DARK, G-069), and
           tests/cron-drift-firing-fixtures.sh has an assertion — 'the real tree passes
           the firing check' — that FAILS for exactly this reason. That suite is a
           guard-layer member, and the guard layer runs in CI on every push and PR
           (doc-lint.yml, T-2686). So option (b) keeps a CI guard permanently red,
           which is the T-2818 corrosion mechanism operating on the layer whose whole
           job is to be believed. If (b) is chosen it needs an allowlist entry or an
           explicit acknowledgement, not silence."
