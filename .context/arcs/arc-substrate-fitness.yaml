description: "Remediation arc from HANDOFF-termlink-remediation-2026-06-22 (built
  on T-2241 comms discovery). Restores the two load-bearing substrate properties the
  discovery found failing: coordination truth (presence as current-state, not a stale
  forever-log) and durable/observable governance delivery (no silent poison-drop).
  Ingestion + corrected slicing in docs/plans/T-2242-substrate-fitness-ingestion.md.
  Drivers are PROPOSED pending human approval; Q1-Q3 + the T-2025 NO-GO revisit are
  Sovereign and unresolved."
