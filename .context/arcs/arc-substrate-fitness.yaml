#   operational (binary upgrade, watched by T-2239 canary). R3 dissolves; R6 -> optional.
# Q3 arc scope: ONE arc (inception+build coexist; cadence is task-level).
# Q1 presence retention: days:2 NOW (interim, shipped) + latest-per-key compaction as R2 build
#   target (only mode that closes T-1991 agent-count scaling; NOT shipped -> new work w/ cv_key).
# Q2 telemetry: local-first capture+aggregate -> daily AGGREGATED push over TermLink to a
#   collector (rides R4 queue; raw stays local; collection topic bounded). Tiered rollup
#   (raw 24-48h, aggregates long). presence=current-state(compact) vs telemetry=series(retain-agg).
