payload:
  summary: 'audit.sh SUMMARY block omits the section scope, so a --section subset run
    is indistinguishable from a full audit at the point an operator actually reads it'
  detail: |
    WHERE
      .agentic-framework/agents/audit/audit.sh   header prints "Sections: <list>"
      .agentic-framework/agents/audit/audit.sh   "=== SUMMARY ===" block prints only Pass/Warn/Fail
      .git/hooks/pre-push (generated by fw git install-hooks)
        line ~404  "$AUDIT_SCRIPT" --section structure   # T-862: fast subset, full audit >90s

    DEFECT
      The audit DOES declare its scope -- in the header, roughly forty lines above the
      SUMMARY. The SUMMARY block itself prints only:

          === SUMMARY ===
          Pass: 38
          Warn: 8
          Fail: 2

      That block is byte-shape-identical whether the run covered one section or all of
      them. It is also the only part most operators read, and the only part quoted into
      push output, handover documents and chat.

      The pre-push hook runs "--section structure" deliberately for speed (documented
      in-hook as T-862). That tradeoff is sound. The defect is that its OUTPUT does not
      say so where it counts, so a subset verdict is read as a whole-project verdict.

    MEASURED (010-termlink, 2026-09-09)
      pre-push (--section structure) : Pass 38   Warn 8    Fail 2
      bare `fw audit` (all sections) : Pass 368  Warn 77   Fail 5

      69 warnings and 3 failures are outside the gate that runs on every push. Because
      the summary shape is identical, they do not read as "not examined" -- they read as
      "not present". In this project that difference hid the entire finding set until a
      session ran the audit bare; among the hidden failures were two dormant cron
      canaries, i.e. scheduled protections that were not running.

    WHY IT MATTERS (Directive 2 -- no silent failures)
      A report that is silently narrower than it appears is the reliability failure the
      directive names. The subset is a performance decision; presenting its result in the
      same shape as a full run is what converts that decision into misinformation.

    PROPOSED FIX (one line, in the SUMMARY block)
      Emit the scope alongside the counts, e.g.

          === SUMMARY (sections: structure -- SUBSET, 1 of N) ===

      or a "Scope:" line directly beneath "=== SUMMARY ===". Either makes it impossible
      to read subset counts as a whole-project verdict. A full run should say so too
      ("sections: all"), so the absence of a qualifier is never itself the signal.

    NOT AFFECTED
      The header "Sections:" line is correct and needs no change. The pre-push subset
      choice needs no change. This is purely about where the scope is stated.
