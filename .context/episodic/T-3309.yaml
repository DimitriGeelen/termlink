# Summary (auto-generated from git commit messages)
summary: |
  hub records per-topic activity and flags idle/unread topics (arc-012 step 4, T-3304 IW-4 C'). New bus tables topic_activity + topic_readers beside the log (retention never deletes them): last writer/time, write count, last fetch, last DATA fetch, fetch count, unread_since (oldest write awaiting a data fetch), per named reader. topic_metadata posts are not activity. Flags (advisory, 30 d, TERMLINK_TOPIC_FLAG_DAYS): idle = watched N days and no write or fetch for N days; unread = a write waited N days for any data fetch (catches the written-but-never-read probe class). Hub records subscribe fetches (optional 'reader' param; empty polls throttled to once a minute; inspect:true walks not counted) and channel.list carries activity/flags/flag_days (+readers on request). CLI info shows activity/flags/readers and inspects without counting; list marks flagged topics; subscribe names itself via TERMLINK_AGENT_ID/identity. MCP subscribe takes 'reader'. Tests: bus 5, hub 2, CLI 2 new; five crates green (bus 118, hub 508, session 499, CLI 1178+180, MCP 942+37); clippy rc 0, nothing on changed lines.

# Key outcomes
outcomes:
  - 'The bus keeps `topic_activity` (tracking start, last write and writer, write count, last fetch, last data fetch, fetch count, `unread_since_ms`) and `topic_readers` (per named reader: last fetch, last data fetch) in SQLite tables beside the log. A sweep leaves them intact, `delete_topic` removes them, and a `topic_metadata` post does not count as a write. Bus test pins each.'
  - '`activity_flags` (pure): `idle` = watched at least N days and no write or fetch for N days; `unread` = a write has waited N days with no data fetch, which fires on a busy unread topic. Unit-tested at the boundaries.'
  - 'The hub records each `channel.subscribe` as a fetch (data fetch when it returned records) under an optional `reader` param. Empty polls persist at most once a minute per (topic, reader), and `inspect: true` walks are not recorded. Tests pin the throttle.'
  - '`channel.list` entries carry `activity`, `flags` and `flag_days` (default 30, `TERMLINK_TOPIC_FLAG_DAYS`), plus `readers` when asked with `readers: true`. Handler test proves the round trip.'
  - 'CLI: `channel info` shows activity, flags and readers (text + JSON) and inspects with `inspect: true`; `channel list` marks flagged topics; `channel subscribe` names itself via `TERMLINK_AGENT_ID` or the loaded identity. MCP subscribe accepts `reader` (default `TERMLINK_AGENT_ID`); MCP list passes the fields through. Unit-tested.'
  - 'The five touched crates'' tests pass, and clippy adds no warnings on changed lines.'

