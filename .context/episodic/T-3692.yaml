# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-11-12 — How READY and last_prompt are persisted (P-1)'
    chose: 'one store state file per agent, `state.meter.ready` (Store::write_state: tmp, fsync, rename, fsync dir), holding per session the READY record, `last_prompt`, the turn stop that ends the prompt''s window, and `ended`, plus the host `boot_id`. Written under the meter lock after every applied `ready`, `prompt_submit`, `turn_stop`, `session_end` and after the built `stop` / `session-end` hooks; read back by `Meter::with_state` at sidecar start (daemon.rs). Records of another boot, an unknown version or a damaged file are not used, and the reason is kept in `last_reasons`; a failed write is counted (`persist_failed`); sessions read back are counted (`restored`).'
    rationale: '06 v0.3 AL-1 line 294 and 8.3 (CR-6.23): persist `last_prompt` with `sess.ready`, read back on the same boot (5.4.f (5)); `rx_mono` is CLOCK_MONOTONIC, only comparable on the same boot. A restored READY record keeps its old `sidecar_epoch`, so the gate still reads it absent (FCW-6, crash table 5.1.f.5); the turn stop is kept so the restored window ends where it would have.'
    alternatives_rejected: ['one file per session (more files and fsyncs, a cleanup problem); persisting on every report (S2 stays in memory by design).']
  - decision: '2026-11-12 — The CR-6.23 restart rule is narrowed, not removed'
    chose: 'keep the rule "no prompt on record and S2 within 120 s reads `operator`", which now means a session that never reported a prompt (a persisted prompt counts), instead of deleting it.'
    rationale: 'until B-29 (P-44, AEF''s adapter) ships, the built hooks send no `prompt_submit`, so every field session has no prompt on record. Deleting the rule would turn those sessions from `operator` to `none` while active, and B-16 (P-7) could then ring a person mid-work once built. Unknown fails toward a person (FCW-16), and the operator''s standing rule is not to switch off a working protection before its replacement is proven.'
    alternatives_rejected: ['deleting the rule to match 06 AL-4 to the letter (the field regression above). The plan''s rollback line still holds: reverting restores T-3687''s behaviour exactly.']

