decisions:
  - decision: '2026-11-13 — dev-build version form'
    chose: '`<tag>+<N>.g<sha9>` (e.g. `0.12.11+4.ga2fcb16f8`); a tagged commit still reports exactly the tag.'
    rationale: 'unique per commit (sha); names the release it sits on; orders after its tag and before the next under `sort -V` and our comparator; same shape the framework uses for FW_VERSION between releases (AEF T-4055), so one convention across the stack; valid SemVer.'
    alternatives_rejected: ['`0.12.12-dev.N+g<sha>` (SemVer-ordered by spec, but claims a next version 0.12.12 that may never exist, and GNU `sort -V` puts `0.12.12-dev.4` ABOVE `0.12.12`); four-part `0.12.11.N` (not SemVer; breaks 3-part parsers such as homebrew/render-formula.sh and Rust parse_version); keep `major.minor.N` and only fix rerun triggers (the description''s fix; leaves the collisions, which are the bug).']

