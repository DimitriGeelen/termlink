# Summary (auto-generated from git commit messages)
summary: |
  a prompt that remembers, not a gate that blocks

# Key outcomes
outcomes:
  - '`scripts/voi-prompt.sh --check` reports what needs a decision and exits 0 when there is nothing to ask — so a quiet state is silent, not a repeated nag'
  - '`--record` persists a decision to a git-tracked store: `set` (a value), `waive` (permanent, with a reason), or `snooze` (temporary, N runs)'
  - '**Two snooze scopes**, because "stop asking about this task" and "stop asking about voi_score" are different requests: `--task T-XXX` and `--global`'
  - '**A run counter drives expiry.** Each `--check` increments it; a snooze recorded at run R becomes askable again at R+N. Default N=10, settable with `--snooze N`'
  - 'An expired snooze re-enters the ask set and says how long it was snoozed, so re-asking is visibly a re-ask rather than a fresh question'
  - 'A **permanent waiver still requires a reason** — empty or bare-true does not waive (carried from T-3174)'
  - 'The store records **who decided and when** for every entry, and is append-only for history while holding current state'
  - '**Fails open and never blocks**: this asks, it does not gate. Unreadable store, bad YAML, no python3 all exit 0 with nothing pending'
  - 'Fixtures `tests/voi-prompt-fixtures.sh` pass, covering the full cycle (ask → snooze → silent for N runs → re-ask), both scopes, and a mutant that breaks expiry so a snooze becomes permanent'
  - 'The T-3174 blocking gate is retired or demoted so the two mechanisms cannot both fire, and `.claude/settings.json` is left untouched — no wiring is needed for a prompt'

