    chose: 'A, the same stated limit as the 2026-11-18 card-write ruling: `hub.revoke` is unix-socket-only, Execute scope, an intent admin row before and a committed row after, a `key-revoked` needs-attention entry from every sidecar; the operator''s route is a runme action. Any same-uid (root) process can call it; that is the AR-4 limit, visible and logged, not a barrier.'
    rationale: 'matches the accepted card-write limit; a rogue revocation is loud and recoverable by re-keying the agent (new key card); the list keeps its only-grows guarantee.'
    alternatives_rejected: ['B (an un-revoke would let a stolen key come back and breaks AL-22 invariant 2); C (no operator revocation in PH-2 defeats the purpose). - **Left open:** replacing root-on-host by the operator key (PH-3, OQ-h); the hub under its own account (Track A).']

