# Key outcomes
outcomes:
  - 'The store records a backend-initiated stop (`Bus::wc_stop`): fenced by the supervisor token, cause ∈ {deadline_stop, revoked, operator_stop} (anything else is `invalid`), only on a `dispatched` or `running` attempt (a terminal or unknown attempt is `cas_mismatch`). A repeat with the same cause is a no-op; a different cause after the first is refused. Per spec §3.3 the stop is an action, not a state: it writes no history row and changes no state, and the attempt record shows `stop_cause`'
  - 'The confirmed end that follows carries the cause on its history entry: T3 (`done`, including `handback-malformed`) uses the request''s cause or else the recorded stop cause, and the sweep''s T4 (`lost`) uses the recorded stop cause instead of its own. No new attempt is allocated by a stop'
  - '`dispatch.stop` JSON-RPC (Execute, like `dispatch.transition`) with the method constant in control.rs and the router entry; the error-code emission and MCP parity checks stay clean (both rc 0; error-code docs lint clean; protocol tests 109/0; RPC test `dispatch_stop_records_the_cause_for_the_confirmed_end`)'
  - 'Bus unit tests (worker_contract/sweep_tests.rs, `stop_*`) cover three CC-25 variants (exit confirmed with a valid hand-back, no exit evidence then the sweep''s T4, revoked); the fourth (exit confirmed, hand-back absent → `done{handback-malformed}`) is the existing T3 outcome rule and is exercised through the vector rather than a new unit test. Plus the refusals (bad token, bad cause, terminal attempt, conflicting second cause). The conformance adapter maps `op: stop` and reports `history_causes` (the cause on each attempt''s last lifecycle row); `scripts/run-wc-vectors.sh` at 25f56ed68 reports CC-25 pass with fail=0'

