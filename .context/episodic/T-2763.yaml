# Summary (auto-generated from git commit messages)
summary: |
  canary-status.sh (/canaries) resolves .context/working/ relative to the CURRENT checkout, with no worktree awareness. Host cron writes canary logs and heartbeats into the MAIN checkout only, so inside a linked worktree every log reads empty and every heartbeat reads ancient. Two failure directions: STALE noise on canaries that are firing fine (annoying), and — far worse — a confident HEALTHY for a canary that IS firing in the main checkout (a false all-clear). fw audit already knows about this ('Cron drift checks skipped — linked worktree'); canary-status does not. Same class as T-2681: a guard whose reported health depends on unversioned local state.

# Key outcomes
outcomes:
  - '`canary-status.sh` detects that it is running inside a linked git worktree (the `.git` entry is a FILE containing `gitdir:`, not a directory) and resolves the canary directory to the MAIN checkout rather than the worktree''s own `.context/working/`'
  - 'Detection is by git''s own answer (`git rev-parse --path-format=absolute --git-common-dir` → parent), NOT by string-matching `.claude/worktrees/` in the path — the naming convention is not a contract and a worktree elsewhere must still resolve'
  - 'When the main checkout''s canary dir cannot be read (permissions, or the T-559 boundary), the script exits **2 (tooling error)** and says so — it must NEVER fall back to the worktree''s empty dir and report healthy, because the fallback IS the false all-clear this task exists to remove'
  - 'The false-all-clear direction is pinned by a fixture: a firing log present in a fixture "main" dir and ABSENT from a fixture "worktree" dir must make the check report FIRING, and must have reported HEALTHY before the fix (the load-bearing assertion)'
  - 'The STALE-noise direction is pinned too: fresh heartbeats in the fixture main dir must clear the STALE classification that the worktree''s stale copies would otherwise produce'
  - 'Existing non-worktree behaviour is unchanged — a fixture run with a plain (non-worktree) checkout resolves to its own `.context/working/` exactly as today (PL-219 real-tree control)'
  - 'Test seam exists so the fixtures need no real second checkout, following the `CANARY_HYGIENE_SRC_DIR` / `CRON_DRIFT_*_DIR` convention — **implemented as `CANARY_STATUS_TEST_GIT_DIR` + `CANARY_STATUS_TEST_GIT_COMMON_DIR`, not the `CANARY_STATUS_MAIN_DIR` this AC sketched.** Deliberate change: a seam that hands the script a ready-made "main dir" would bypass both the worktree DECISION (`git_dir != git_common_dir`) and the main-root DERIVATION (`dirname`) — the two pieces of logic most likely to be wrong. Feeding the two raw git answers instead means the fixtures exercise that real code, so a bug in either is caught rather than stubbed over.'
  - 'Output states which directory it read, so an operator can tell worktree-resolved from local-resolved at a glance (the T-2680 scope-disclaimer lesson: a guard must say what it looked at)'

