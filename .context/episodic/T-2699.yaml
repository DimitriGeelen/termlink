  - 'Fixture suite `tests/error-code-emission-fixtures.sh` covers: emitted code passes, dead code fires, allowlisted dead code suppressed, numeric-literal emission counts as emitted, defining-file-only use does NOT count, absent root is a tooling error'
  - 'The three real dead codes are acknowledged with honest reasons rather than hidden — the allowlist is the ledger of an open question, not a silencer'
  - '`control.rs` annotates each of the three at its definition so the contract stops overstating enforcement; no constant renamed, no value changed'

