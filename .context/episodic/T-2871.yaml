  - '**`--wait` returning success implies queryable.** Property HOLDS (live-verified: `status` resolved 4s into a 25s command) and the regression test now RUNS GREEN — `cargo test -p termlink --bin termlink -- execution` (the handover''s `-p termlink-cli --lib` invocation was wrong: the crate''s package name is `termlink` and it has no lib target): 22 passed, 0 failed, including `spawn_cmd_register_brackets_user_command` pinning the ordering (register backgrounded → user cmd → kill) that guarantees the non-empty window. 2026-09-07.'
  - '**Terminal state is retrievable, or the absence is loud.** CHOSE loud absence (tests run green 2026-09-07; durable half filed as **T-2914**): `spawn_terminal_state()` discloses at spawn time — text line + JSON `terminal_state` field — that a background+command session deregisters at exit with no retrievable exit_code/finished_at, pointing at `termlink exec` for captured results. **Reason:** durable terminal state needs session-store/protocol changes (filed as T-2914); the loud disclosure closes the Directive-#2 gap now without deciding the store design in passing. Scoped strictly to background+command (tmux/terminal persist; command-less background never self-terminates) — pinned by `terminal_state_note_is_scoped_to_background_with_command`.'
  - '**Reporter''s variant addressed.** ESTABLISHED, and reply SENT 2026-09-07 at agent-chat-arc offset 1170 (in_reply_to=873, their requested durable route — carries task ids T-2871/T-2914, both findings, outcome classification, and the interim `termlink exec`/tmux guidance): their `--wait` TIMEOUT is a **different defect** from the filed one. Ours registered and succeeded; theirs never registered — an environmental register failure inside the spawned shell (hub unreachable / bad TERMLINK_RUNTIME_DIR in their permissions-constrained context). The timeout is the designed loud path; what failed them is that `spawn_detached` nulls the spawned shell''s stdout/stderr (execution.rs:663-665), so register''s own error is discarded and the timeout is the ONLY symptom. Mitigation added in this session''s WIP: the timeout message (text + JSON `hint`) now names the discarded-output cause and what to check. DONE: reply posted to the offset-873 thread at offset 1170 via `termlink_agent_reply` (metadata: project=010-termlink, thread=T-2871).'

