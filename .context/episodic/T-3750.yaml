decisions:
  - decision: '2026-11-12 — how remote-inbox mail reaches the running session'
    chose: 'a relay (`scripts/lib/remote-inbox-relay.py`) that stores new remote-inbox peer posts in the AEF sidecar receiver store (`receiver.store_message`, envelope `via: hub-topic`, id `remote-<sha16(hub|topic|offset)>`), run each sweep of the existing 5-minute `scripts/notify-sidecar-supervisor.sh` cron. The receiver''s own watcher (30 s tick) injects and the prompt hook surfaces and records HANDED_OVER, exactly as for local-hub mail.'
    rationale: 'reuses the one path that already reaches a running session (inject when ready, transcript-evidenced hand-over, receipts) and the existing reader (remote-inbox-mail.py + its seen-marker scheme). No AEF edit, no new cron (DP-3: within an existing operational job, guard cap unchanged at 99/34), live without operator action because cron re-reads the script each run. Latency ≤ 5 min + one watcher tick.'
    alternatives_rejected: ['1. Extend the AEF watcher''s `ingest_hub` to read remote hubs — the right long-term home, but vendored (lost at re-vendor). Request text for AEF below. 2. A project UserPromptSubmit/Stop hook running the reader — fires only when the operator types or a turn ends; an idle session (the ring20 case) would still not see the mail, and it adds hub latency to every prompt. 3. Re-posting remote mail onto our local inbox topic — duplicates the message on a second hub, forges the sender''s position in another topic, and the watcher would then RECEIVED-receipt it on the wrong rail. 4. A new cron of its own — breaks DP-3 without retiring a guard, and needs an operator install. 5. Sharing the session-start seen-markers — the relay has its own cursor ("stored in the receiver" is not "seen"); it only SEEDS from them so history already shown at session start is not replayed. - **AEF request (not sent):** "lib/sidecar/watcher.py ingest_hub: also drain the agent''s inbox topics on every remote hub in hubs.toml (bounded per hub, NOT CHECKED per hub when unreachable), so consumer projects do not need a relay. 010-termlink T-3750 runs one meanwhile."']

