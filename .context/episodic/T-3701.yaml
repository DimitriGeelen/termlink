# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-11-12 — where the open-mail check lives'
    chose: 'a `RemovalGuard` trait in termlink-bus, installed by the hub; every bus removal path on a guarded topic previews its exact offsets, asks the guard, and deletes exactly those offsets.'
    rationale: 'three removal paths existed (RPC handlers, the periodic sweeper, post-time ceilings); a check in the handlers alone would leave two open. Deleting by explicit offset makes the AL-31 concurrency rule hold without a lock across the check: a post that lands after the check is never among the removed offsets, and a final stage never becomes open again.'
    alternatives_rejected: ['checks in the RPC handlers only (bypassed by the sweeper and the ceilings); teaching the bus the sidecar wire format (the bus stays mail-agnostic).']
  - decision: '2026-11-12 — admin log kept 30 days'
    chose: 'a separate `rpc-admin.jsonl`, written synchronously (FCW-128 needs a write that can fail the RPC), pruned only of rows older than 30 days once past 16 MiB; rows also mirrored with `admin:true` into `rpc-audit.jsonl` for existing readers. `channel.create` is not an admin RPC: every sidecar re-creates its inbox on each note.'
    rationale: '`rpc-audit.jsonl` is size-rotated with one backup (T-2251) and written by a queued thread (T-3475), so it can neither keep rows 30 days nor refuse an RPC.'
    alternatives_rejected: ['changing the shared rotation in termlink-session (outside the write set; it also serves the session daemon).']

