  - decision: '2026-11-02 — How a second hub is declared: a marker in its runtime dir'
    chose: '`<runtime_dir>/second-hub.declared`, written by `termlink hub start --allow-second-hub` and removed by a plain start; an operator can also create it by hand for a hub already running. Two+ live hubs with at most one undeclared = WARN (as before); two+ undeclared = FAIL.'
    rationale: '`--allow-second-hub` was a start-time flag with no trace on disk, so preflight could not tell declared from accidental. A per-dir marker needs no HOME, travels with the hub, and is cleared on an ordinary restart.'
