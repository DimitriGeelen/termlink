  - decision: '2026-11-03 — O-1 cross-hub file delivery: A, encrypted only, for now (operator ruling)'
    chose: 'A (operator: "For now yes, but we want to improve it for the future"). `artifact put --hub` only with `--encrypt-to <agent>`; a plaintext cross-hub put is refused with a reason (DR-5 A, 6.4.6).'
    rationale: 'the only option where a file''s content is not readable on another machine''s hub; costs ring20 a short wait for per-agent keys (B-11). Scored A +16, B -7, C -16 (product set).'
    alternatives_rejected: ['B plaintext between the operator''s hubs with a risk acceptance; C defer to PH-4. - **Left open (operator''s "improve for the future"):** existing routes that already carry files between machines are NOT covered by O-1 and stay as they are for now: `termlink file send` (TLS in transit, readable on the hub), the runme fleet upgrade stream, ssh/scp, Pen''s SMB mounts, 055''s ssh gate. Follow-up: bring them under the same rule later.']
  - decision: '2026-11-03 — O-2 doorbell: D+ with an external 300 s fallback (operator ruling; supersedes DR-6 A)'
    chose: 'D+ (operator: "D plus is fine but we also need to have a fallback option ..."). Not A: the operator rejected A because agents must receive and act on messages without a person pressing Enter. 1. Normal ring: only when the session''s adapter READY flag says the agent has finished its turn, AND no one typed in that terminal recently (activity veto, T-3387; 30 s), AND no conversation is under way in that session. 2. Fallback (outside the agent''s own flag, a watchdog the sidecar runs): if NOTHING has happened in the session for 300 s, inject anyway even when the flag says busy, so a stuck or false flag can never hold a message forever. "Nothing happened" = no typing AND no human-to-agent or agent-to-agent communication in either direction (operator: "that means typing but also H2H communication, so you need to figure out how you can measure that"). 3. Delivery stays strict: a typed line is ATTEMPTED; HANDED_OVER only from transcript evidence (as built in AEF inject.py/hooks.py: "Injection alone never records HANDED_OVER"; no evidence in 90 s = HANDOVER_UNCONFIRMED). 4. Line format without brackets (SI-1), as DR-6 proposed. 5. The READY flag is harness-neutral: written per harness by its adapter (Claude Code via hooks; others via theirs).'
    rationale: 'operator: the point is that agents receive and act; also observed that typed lines arrive mid-task, sit unsent when Enter did not take, and that he deletes them; a false "delivered" must be impossible.'
    alternatives_rejected: ['A (ring only when no client attached: an attended-but-idle agent never acts); B (today''s always-ring: types into a busy session and into a person''s half-written prompt). - **Change requests to step 4 (architect, next revision):** CR-O2a define and measure "communication under way / last activity" per session: terminal input (typing), agent output (transcript growth, turn start/stop events), and peer traffic for that session (messages sent/received on its inbox and DM topics, hook surfacing events), so the 300 s fallback and the conversation check have a measured signal; CR-O2b the 300 s fallback as a sidecar watchdog independent of the READY flag, with its own audit row; CR-O2c conversation detection (operator<->agent and agent<->agent) as a separate signal from the agent''s busy flag.']
  - decision: '2026-11-03 — O-3 who may be main before signed profiles: A with a tightening (operator ruling, after consultation)'
    chose: 'A with the tightening (operator: "A with the tightening"). Any interactive session of the project may become main (first claim wins; operator pin overrides), as built, PLUS: (1) a renewal or takeover counts only on a HUMAN-initiated prompt, never on automated activity (timers, background prompts, injected lines); (2) a session where the operator actually prompts can take main over faster than lapse + quiet + cooldown when the holder shows no human activity; (3) a loud "mail waiting, main not reading" signal to the operator.'
    rationale: 'consultation (docs/reports/T-3353-O3-consultation/: opencode A, antigravity A, codex C if operator attention is binding, else A defensible). All three: B is degenerate (all sessions share one agent id; no named agent = no main at all, the operator''s objection). All three named the residual risk of A: a forgotten session renewing forever via automated prompts; the tightening is their shared fix.'
    alternatives_rejected: ['B (filters nothing, adds a no-main outage); C (no pin = no main, mail waits; pin fatigue). - **Change request CR-O3:** architect specifies (a) how "human-initiated prompt" is detected per harness (adapter; ties to CR-O2a''s activity measurement), (b) the fast-takeover rule and its bound, (c) the waiting-mail signal and where it lands (session-start alerts, cockpit, operator).']
  - decision: '2026-11-03 — O-4 switch off Claude Code SendMessage for this project: A (operator ruling)'
    chose: 'A (operator: "A"). `permissions.deny` for `SendMessage` in this project''s settings (6.10.2, ends RA-5); the in-process sub-agent tool (Agent/Task) stays allowed and logged (6.10.1) while the framework''s dispatch uses it.'
    rationale: 'one audited route for agent mail (FX-1), consistent with O-3; the replacement route (T-3386) is done. Scored A +16, B 0, C -9 (product set).'
    alternatives_rejected: ['B log only (a second, unaudited mail channel stays open); C disable both (breaks framework dispatch). - **Left open:** the deny is an operator act (6.10.2): delivered as a runme action under build item B-18; the session message prover (T-2876) uses SendMessage and must be re-based on TermLink before or with the deny.']
  - decision: '2026-11-03 — O-5 the starting values of section 8: A, accepted as one package (operator ruling)'
    chose: 'A (operator: "A"). V-1..V-13 (and the related DR-3, DR-12, DR-14) accepted as starting values under FP-4: each is measured in operation, its measurement is an acceptance item of its build item, and it is tuned from the measurement. V-9''s lease constants stand together with O-3''s fast-takeover tightening (CR-O3).'
    rationale: 'starting values with built-in measurement correct themselves; 15 separate rulings would spend operator attention on details.'
    alternatives_rejected: ['B one by one; C defer. - **Left open:** V-14 (GP-4 offline, 8.2) and V-15 (security levels) are O-7''s subject; V-16 (GP-11) stays open.']
  - decision: '2026-11-03 — O-6 the four step-3 assumptions (operator rulings, all four recorded as below; not "as assumed")'
  - decision: '2026-11-03 — O-7 security levels: A, three fixed levels per project (operator ruling)'
    chose: 'A (operator: "A"). L0 base (today, every project), L1 separate accounts (agents never as root), L2 keyed (operator-signed policy records, confirmation for high-impact classes, encrypted DMs). The floor is never switched off at any level; raising a level is an approval, lowering is high-impact (XR-6); the Tier 0 override stays as logged break-glass (8.4, DR-13 A).'
