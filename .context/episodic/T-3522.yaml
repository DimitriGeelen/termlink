# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-21 — adapter mapping or backend gap for confirm_end'
    chose: 'Both, split by case. The adapter maps `confirm_end` to the real sweep path: `Bus::wc_confirm_end` refuses a done attempt with `forbidden_transition`, otherwise runs two sweeps at the current epoch and one more G later on the injected clock. The backend changes only where a case showed a real divergence: a hub end over a done attempt answered nothing where CC-02 expects the refusal. CC-01 and CC-03 (evidence-present) and CC-03 (no-evidence) plus CC-06 stay failing with the diverging step named, filed as T-3525 and T-3526. - **Quoted vector text:** vocabulary `confirm_end`: "the sweep writer confirms the attempt''s end by the backend''s own evidence (hub two sweeps at the last-seen epoch then G; hubless independent probe, evidence read first) and acts on it". CC-02: `complete` accepted T3, then `confirm_end` expects `{fence_reject: forbidden_transition}`. CC-06: a running attempt with no `seen_alive_epoch`, clock 20, `confirm_end` expects `{accepted: T4}`.'
    rationale: 'S2 `absence()` counts absence only for an attempt whose binding was seen at the current epoch. That is §3.4 as CC-17 pins it ("acted on by deadlines only"), and `dispatched_never_seen_goes_unknown…` says "never seen, so no end was observed". So the sweep is right for seen attempts, and the two-sweeps-then-G mapping fits them. CC-06 and CC-03 (no-evidence) want T4 on a never-seen attempt before G, which contradicts §3.4, so this needs an AEF ruling, not a backend patch (T-3526). CC-01 and CC-03 (evidence-present) need the hub to read signed evidence persisted before the end; the store has no hub-side evidence intake (T-3525).'
    alternatives_rejected: ['(a) writing T4 directly from the adapter: a shortcut around the state machine, which the task forbids. (b) letting the sweep count never-seen attempts: CC-06 would pass, but §3.4 and CC-17 would be weakened, and both are pinned by tests. (c) marking CC-01/03/06 n/a: the vectors set `n_a_allowed: false` for transition subjects (§6.6 N2).']

