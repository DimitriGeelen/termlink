summary: |
  B7 receive path (verify, policy hook, RECEIVED/STORED, signed stage records back to the sender). run the receive_hub tests one hub at a time (a loaded host missed the 5 s hub.version bound with 8 hubs starting together)

# Key outcomes
outcomes:
  - 'pull.rs (C-6): a receiver reads its own inbox topic from a durable cursor, re-verifies every `sidecar.msg.v1` envelope with `wire::verify` (roster + own instance id), calls a policy hook point before storing, then appends RECEIVED and stores (Store::put); STORED is reported only after put returns Stored or Duplicate (FC-2)'
  - 'The transport signature reaches the receiver without a hub change: the sender puts signer key and signature in the post metadata and the receiver checks them against the payload; a missing, wrong-key (host key, sibling key) or altered signature is REFUSED with its reason on the chain plus a needs-attention entry, never stored (FC-1 receiver half)'
  - 'Stage records (5.3): the receiver signs `{kind:"stage", from, conv, msg_id, stage, ts_ms, chain_head}` and posts it to the sender''s inbox through the outbox; the sender''s receiver verifies it against the roster, accepts it only for a message it SENT, keeps it forward-only, and records RECEIVED and STORED with the receiver''s times; an unsigned or wrongly signed stage is ignored and shown (attention)'
  - 'Failure and restart: a store failure at any step leaves no STORED report and the message is retried on the next pass; a restart re-reads from the cursor without a second RECEIVED or STORED (FC-2, FC-3 receive half)'
  - 'Same (sender, conv, msg_id) with another body: first record kept, CONFLICT recorded, no STORED stage for the second (FC-10); a second sidecar on the same store is refused (FC-9)'
  - 'hub_id pin on receive (FX-2): a hub whose id differs from the declared one is not read and a needs-attention entry is written (FC-14 receive half)'
  - 'Concurrent writers (send pump, receiver) cannot fork a conversation chain: Store serialises appends in-process'
  - '`cargo test -p termlink-sidecar --test receive_hub` passes and the full `cargo test -p termlink-sidecar` stays green; no production path is touched'

