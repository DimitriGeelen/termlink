# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-11 — How the receiver gets the transport signature'
    chose: 'the sender repeats signer key and signature in the post metadata (`sidecar_pk`, `sidecar_sig`); the receiver verifies them against the payload it read.'
    rationale: '`channel.subscribe` does not return the post''s key or signature (the bus envelope does not keep them), and PH-1 leaves the hub untouched (note 2.1). Metadata is outside the signed bytes, so altering it can only make verification fail.'
    alternatives_rejected: ['a hub change to keep and return signatures (outside PH-1); trusting the hub''s check alone (5.2 requires the receiver to re-verify).']
  - decision: '2026-10-11 — Not-rostered senders in B7'
    chose: 'REFUSED on the chain plus a needs-attention entry, not stored.'
    rationale: 'the store-and-show-but-withhold rule for senders outside the roster (note 7.2) is B8''s receiver check; B7 provides the policy hook point (`pull::Policy`) B8 fills.'

