# Key outcomes
outcomes:
  - 'The queue is **measured, not estimated**: every task in `.tasks/active/` with at least one unticked `### Human` AC is enumerated, with its age, and the count is reconciled against what `fw review-queue` reports (141) and against the audit''s D2 figure (57). If those three disagree, the disagreement is itself recorded — three counts of the same backlog that do not match is a finding.'
  - 'Each unticked Human AC is **classified by whether its `**Expected:**` clause is mechanically checkable** — a file existing, a command exiting 0, an exact string in output — versus requiring human taste (tone, layout, "looks right", a genuine go/no-go). Classification is by a written, stated rule applied uniformly, not case-by-case judgement.'
  - 'The classifier is shown to be **honest about its own limits**: a sample of its verdicts is hand-checked against the underlying AC text and the disagreement rate is reported. A classifier whose error rate is unmeasured cannot support a claim about the corpus.'
  - 'The result is stated as a **proportion with absolute numbers on both sides**, so the answer to T-2940''s open question ("are these mis-owned rather than genuinely pending?") is quantified rather than asserted.'
  - 'The finding is **filed, not acted on**: no Human AC is ticked, no task is re-owned, no task is closed. T-2940''s own remediation text says to file rather than bulk-reassign, and bulk-reassigning 141 tasks would be exactly the unreviewed mass action the review queue exists to prevent.'
  - 'A research artifact is written to `docs/reports/` carrying the method, the numbers, the sample check, and the limits — so the next reader can falsify the classification instead of trusting it.'

