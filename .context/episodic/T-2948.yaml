  - 'Premise pinned: `.git/hooks/pre-push` invokes `"$AUDIT_SCRIPT" --section structure`, a deliberate speed tradeoff documented in-hook as T-862 (full audit >90s with 100+ tasks). The subset is NOT the defect; the unlabelled summary is.'
  - 'Delta measured and recorded: structure-only 38P/8W/2F vs full 368P/77W/5F — 69 warnings and 3 failures never surface at push time, and so read as absent rather than unexamined (Directive 2).'
