  Found by check-mcp-cli-twin-drift.sh (T-2999). T-2619/T-2621 made the CLI parse_find_idle_log / parse_substrate_log / parse_queue_log / parse_claims_log count an unparseable ts as malformed at the extraction gate. The MCP twins (parse_find_idle_log_mcp, parse_substrate_log_mcp, parse_queue_log_mcp, parse_claims_log in termlink-mcp/src/tools.rs) still pass ts through fleet_history_rfc3339_to_unix, which returns a 0 sentinel on failure, so a bad-ts row is dropped by the cutoff filter and never counted — the MCP history tools under-report malformed_lines_skipped. Restore parity; no new behaviour.

