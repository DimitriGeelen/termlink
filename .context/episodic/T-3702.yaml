  - decision: '2026-11-12 — owner-only opt-in by env, not default-on in the launcher'
    chose: '`TERMLINK_OWNER_ONLY=<owner>` read once at session start (reaches the session daemon through `termlink spawn --env`); `TERMLINK_OWNER_ONLY_CHECK=0` is the rollback; the use log is always on.'
    rationale: 'no Registration field (its struct literals live in termlink-cli tests, edited concurrently by T-3749) and no CLI flag churn; the launcher default would switch off working waker injects (NID).'
    alternatives_rejected: ['default-on in `scripts/tl-claude.sh` now (breaks wakers); a Registration `owner_only` field (cross-crate literal churn under concurrency).']
  - decision: '2026-11-12 — where the rows go'
    chose: 'session rows at `<session socket dir>/use-log/<session-id>.jsonl` (`TERMLINK_USE_LOG` overrides), hub rows at `<runtime_dir>/rpc-founding.jsonl`; one O_APPEND write per row through the shared capped writer (16 MiB, one rotated generation). A row that cannot be written refuses the verb (FCW-132, new code -32042 USE_LOG_UNWRITABLE).'
    rationale: 'beside the socket keeps test sessions'' rows in their temp dirs; the hub file mirrors T-3701''s rpc-admin.jsonl.'
