# Key outcomes
outcomes:
  - 'The `event.collect` RPC in the dispatch loop (dispatch.rs ~416) is bounded so a half-open hub cannot make a single collect await indefinitely past the `--timeout` deadline (e.g. `tokio::select!` the collect against the remaining `collect_timeout`, or a per-call `tokio::time::timeout`). **Done:** routed through the shared `client::rpc_call_addr_with_timeout` (T-2641) with a per-call bound from new `collect_call_bound(remaining, subscribe_timeout_ms)` = `min(remaining, subscribe_wait + 5s grace)` — a wedged call errors within ~5.5s and the deadline is never overshot.'
  - 'The `Err` arm applies a small backoff before `continue` (mirror T-2636 / events.rs sleep-on-error) so the up-to-5 retry burst is paced, not a zero-delay micro-spin. **Done:** `tokio::time::sleep(COLLECT_ERR_BACKOFF)` (500ms) before `continue`.'
  - 'A test proves the collect loop honors `--timeout` even when a collect call never returns (half-open hub), and that consecutive errors are paced. **Done:** 4 unit tests on `collect_call_bound` (caps a wedged call well under a large budget = the honors-timeout property; tracks remaining near deadline; floored never-zero) + `collect_err_backoff_is_paced_not_zero`. The half-open-hang property is additionally inherited from the primitive''s own black-hole test (`client::tests::rpc_call_addr_with_timeout_bounds_a_silent_server`). Load-bearing proven via temp-revert (cap→remaining + backoff→0 fails 3 tests).'
  - '`cargo test -p termlink` green; `cargo build -p termlink` succeeds.'

