summary: |
  release.yml runs cargo build --release and never cargo test, so a regression in the 2055-test workspace suite ships to GitHub Releases and Homebrew (T-2683 F1/G4).

# Key outcomes
outcomes:
  - '`release.yml` gains a `test` job running `cargo test --workspace`, and both build jobs declare `needs: [test]` so a red suite blocks the build — no binary is produced, not merely un-published'
  - 'The test job also runs the source-level guard layer (`scripts/run-guard-layer.sh`), so the static checks that guard the code run at the one moment code becomes a release'
  - '`timeout-minutes` bounds the job so a hung test cannot burn CI indefinitely'
  - 'The workflow YAML parses'
  - 'The gate is only added once the suite is actually green — landing a gate on a red suite would be shipping a known-broken pipeline (see T-2687)'
  - 'The release job''s existing `needs: [build-macos, build-linux]` chain is preserved, so the gate is additive and cannot skip a build step'

