# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-20 — what --push does on a channel topic'
    chose: 'both, by topic. `inbox:<id>` and `dm:<a>:<b>` are delivered. The WS subscribes to their wake event (`inbox.queued` / `dm.queued`) and keeps only events whose `payload.channel` is this topic. Each such event triggers a durable fetch from the cursor that prints the envelopes (`[push] <topic> offset=N sender: payload`). The backlog is fetched first, and a fetch also runs every 30 s as a safety net. Every other channel topic (`agent-presence`, `framework:pickup`, ...) is refused at once, before any hub contact, with a hint naming `--follow` and the event topics. Hub event topics (dotted with no `:`, or a `*` pattern) keep today''s behaviour, so the pushwaker''s `inbox.queued --push` / `dm.queued --push` are untouched.'
    rationale: 'inbox/dm are exactly the topics the report used, and the hub already emits a wake for each post on them, so delivering costs one fetch per wake and gives the user what they asked for. Other channels have no wake event, so a "push" there could only be a disguised poll; refusing names the honest tool (`--follow`). The safety-net fetch covers posts that emit no wake (a dm relay post whose sender is neither participant) and the gap between the backlog fetch and the WS subscription going live.'
    alternatives_rejected: ['refusing inbox:/dm: too (simplest, but throws away a working wake path the hub already provides); silently degrading every channel topic to the poll loop (still "push" in name only, and hides that the WS carries nothing).']

