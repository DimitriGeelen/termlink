  - decision: '2026-10-12 — Orphan rule: "no CLAIMED line for the attempt", at start-up only'
    chose: 'close a claim as an orphan only when its attempt has no CLAIMED line, and only in `Deliverer::new` (start-up).'
    rationale: '`pull` builds the frame strictly after claim, record and CLAIMED, so a missing CLAIMED line proves no frame left; at start-up no pull of this process can be half-way, so an in-flight claim is never mistaken for an orphan.'
    alternatives_rejected: ['closing orphans on every pull (races a concurrent pull between its claim and its CLAIMED line: a double frame).']
  - decision: '2026-10-12 — Soak in-process, no hub'
    chose: 'drive the store, claim and record directly with a scripted harness.'
    rationale: 'H-16 is about crashes of the store, the claim and the record; the receive path''s network half is covered by the live-hub tests, and 1000 hub restarts would measure the hub, not the sidecar.'

