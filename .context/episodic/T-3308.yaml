# Summary (auto-generated from git commit messages)
summary: |
  subscribe pages say why they ended (arc-012 step 3, T-3304 IW-3). Hub adds end_reason 'limit' (page full, more may follow) / 'end' (caught up), and 'deadline' in WALK_DEADLINE_EXCEEDED data; client deadline pages carry it too. CLI single-shot subscribe now notes on stderr when a page was cut by --limit (it used to stop silently after 100). The session-crate inbox reader pages to the end (was one 1000-record page, so transfers past it were never seen on a one-shot inbox list), falls back to full-page heuristics on old hubs, caps at 200 pages, and records a retention gap only when it resumed from its own cursor (FallbackCtx::take_retention_gaps + warn). MCP description documents end_reason. Tests: hub 3, session 4, CLI 1 new; four-crate suites all green (hub 506, session 499, CLI 1176+180, MCP 942+37 parity); clippy rc 0, no warnings on changed lines.

# Key outcomes
outcomes:
  - 'Hub `channel.subscribe` success responses carry `end_reason`: `"limit"` (the page filled; more may follow from `next_cursor`) or `"end"` (no further record at read time). The `WALK_DEADLINE_EXCEEDED` error data carries `end_reason: "deadline"`. Hub tests pin all three, plus a filtered walk ending in `end`.'
  - '`client::deadline_partial_page` sets `end_reason: "deadline"` on the page it builds (existing test extended).'
  - 'CLI single-shot subscribe (no `--follow`, no `--tail`), when the page ends on `limit`, prints a stderr note naming the topic, the resume offset and the ways to continue (a JSON line with `--json`); stdout is unchanged. The note is absent on `end` and on old hubs with no field. Unit-tested.'
  - 'The inbox reader pages until the page does not end on `limit` (old hubs: until a page is shorter than the limit), bounded by a page cap so a runaway hub cannot spin it. Transfers past the first 1000 records are found (test with a fake multi-page client response sequence).'
  - 'The inbox reader, when it resumed from its own saved cursor and the hub reports `gap`, logs a `tracing::warn!` naming topic and skipped count, and records it on `FallbackCtx`, exposed through `take_retention_gaps()`. A fresh read from 0 records nothing. Tested.'
  - 'The MCP `termlink_channel_subscribe` description documents `end_reason`. Workspace tests for hub, session, CLI and MCP pass, and clippy adds no new warnings on the touched files.'

