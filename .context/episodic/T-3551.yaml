decisions:
  - decision: '2026-10-22 — the canary judges each session''s ROOT process against the session''s registered cwd'
    chose: 'root process only, judged against `metadata.cwd`.'
    rationale: 'the first live run (descendants, each by its own cwd) fired on 5 sessions and every finding was legitimate: pyright running from its install dir under `/root` (itself a git repo with `.framework.yaml`) with the session''s `PROJECT_ROOT`, a 055 worktree pointing at its main checkout, and AEF''s fresh-machine test pointing its children at a `/tmp` fixture project on purpose. A leak arrives through the root process (the register a polluted server or shell started), and every dispatched worker registers as a session of its own, so the root is where it shows.'
    alternatives_rejected: ['descendants by their own cwd (5/5 false positives); descendants by the session cwd (still fires on test harnesses that set a fixture project deliberately).']
  - decision: '2026-10-22 — refuse in `register`, with no override flag'
    chose: '`register` and `register --self` fail with a message naming each variable and both projects.'
    rationale: 'ruling A ("refuse, not warn"). `register` is the one choke point every spawned session and worker passes; after T-3550 a spawned session cannot inherit a foreign value, so a refusal means a polluted shell. An inherited override would itself be ambient authority (AEF''s point on `FW_TASKS_DIR_OVERRIDE`); the fix is to unset the variable.'
    alternatives_rejected: ['a warning (2026-10-16 shows a recurrence needs a stop); a `--allow-foreign-project` flag (no case found).']
  - decision: '2026-10-22 — unknown is never a finding; FRAMEWORK_ROOT is not judged in sessions'
    rationale: 'a value outside every project (test temp dirs) or a session outside every project cannot be judged without guessing. `FRAMEWORK_ROOT` legitimately points outside the project in shared-tooling mode. The tmux server''s GLOBAL env is stricter: any project variable there, `FRAMEWORK_ROOT` included, fires, because every new session inherits it.'

