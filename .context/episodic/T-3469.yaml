# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-21 — IW-3: who owns a dispatched worker''s git checkout (operator ruling)'
    chose: 'B, each worker owns its own clone per claim under `/var/lib/termlink/work/<hub8>/<claim_id>`, refined by the operator''s btrfs input (brief §6.1): on btrfs hosts the clone is a snapshot or reflink copy of a per-repo template that is kept current; elsewhere it is a `git clone`. Operator: "ok as recommended" (2026-10-21). - **Rule boundary recorded:** the no-worktree rule is unchanged for this repo''s sessions. Worker clones are not worktrees, live under `/var/lib/termlink/work`, and are only ever entered by a launcher that starts the session there.'
    rationale: 'it is the only option that works across hosts and keeps the rule intact. It fences pushes with the claim lease and carries into containers unchanged. With copy-on-write it writes almost no data (measured 72 KiB vs 122 MiB for a clone) and brings the untracked framework files and guards along. Scored +55 vs A −19, C −13, D −19.'
    alternatives_rejected: ['A (the hub as a git server, useless across hosts without federation); C (reopens the conditions behind the worktree incidents); D (the cost of waiting is open-ended, while B carries into containers).']

