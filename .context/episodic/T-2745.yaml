# Key outcomes
outcomes:
  - '`termlink list --stale-binary` retains only sessions whose recorded `termlink_version` is older than the running binary''s — a pure read, no new data collected and no state mutated'
  - 'A session with no recorded version counts as stale (T-2359''s precedent: a peer too old to report its version *is* the staleness class); treating absent as current would pass exactly the oldest sessions'
  - 'Version comparison is a tested pure helper over numeric `major.minor.patch`, so `0.11.9` orders before `0.11.1346` — the case a string compare gets backwards'
  - 'An unparseable version is treated as stale rather than silently skipped, and that choice is stated in the helper (a version we cannot read is not a version we can vouch for)'
  - 'Text output names both the session''s version and the reference version, so the operator can act without a second command'
  - 'JSON output carries the reference version at the envelope level and is a strict superset of the existing shape — no field removed or renamed'
  - 'Negative coverage: an all-current fleet reports nothing and says so affirmatively, and a session newer than the running binary is not reported (PL-219 — the filter must be able to not fire)'
  - 'The lineage caveat is stated where a reader hits it: patch is commits-since-tag, so comparison holds within one build lineage'
  - 'Load-bearing proof recorded: replacing the numeric comparison with a string compare fails a test'

