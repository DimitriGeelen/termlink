# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-20 — what the watch treats as "its own" and as "free"'
    chose: 'same dev+inode as the socket this hub bound = intact (no self-connect each tick); a path that is gone, or holds a dead socket (connect refused), is free and is re-created (bind directly when gone; `.new` + rename over a dead socket, as start does); a path another listener answers on, or holding a non-socket file, is left alone with one WARN per distinct file.'
    rationale: 'the AC forbids removing a socket another live hub answers on; a dead socket is what `hub start` already treats as replaceable (T-3367). Connecting to our own listener every 10s adds accept/audit noise for no information the inode does not give.'
    alternatives_rejected: ['threading the re-created listener into the existing accept loop''s select; a second unix-only `run_accept_loop` with the same secret and shutdown signal reuses its logic unchanged.']
  - decision: '2026-10-20 — how `hub status` reports a dead socket'
    chose: 'keep `status: "running"` (the process is alive), add `socket_ok` / `socket_error`, set `ok:false`; `--short` prints `running <pid> socket-unreachable`; `--check` exits 1. Plain `hub status` still exits 0, as it does for `not_running`.'
    rationale: 'watchdog.sh, session-selftest.sh and hub-recover-original-runtime.sh gate on plain `hub status`''s exit code; changing it would change their restart behaviour, out of scope here. Preflight Check 8 turns `socket_ok:false` into a high-severity FAIL.'

