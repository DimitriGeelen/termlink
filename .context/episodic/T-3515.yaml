# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-21 — recover on a cache miss, from the stored record (not meta.db)'
    chose: 'the hub stamps `metadata.client_msg_id` on the stored envelope (metadata is outside the signed bytes), and a dedupe miss within one TTL of cache creation (`PostDedupe::is_cold`) scans the topic''s newest 1024 records for the same (sender_id, client_msg_id) before appending (`dedupe::find_stored_post`).'
    rationale: 'no schema change and no extra durable step (T-3488 test untouched); the id is written in the same append as the record. **Cost:** none after the first TTL post-start; during it, one read of up to 1024 records per fresh-id post. A resend further than 1024 records back, or one whose record was swept, is not recovered. Persisting in meta.db rejected: new table plus a write per post.'
    alternatives_rejected: ['persisting (sender, id)->offset in meta.db.']

