# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-21 — notify design (AC 2)'
    chose: 'a new `notify` permission scope ranking below `interact` (Observe < Notify < Interact < Control < Execute), plus a dedicated `command.notify` RPC whose only input is message ids. The session composes the doorbell line itself (`doorbell_line`, byte-identical to the sidecar''s `injection_line`). Authentication stays in the `auth.token` handshake.'
    rationale: 'a notify holder can ring the doorbell and nothing else. It cannot type free text, emit events or change state. The sidecar never holds Control.'
    alternatives_rejected: ['(a) a Control-scope inject with a text filter, because the filter would be the whole security boundary; (b) reusing `interact`, which would let a doorbell holder emit events and mutate state; (c) a token value on the CLI or in an env var, which the ruling forbids. - **Token source:** `--token-file` (refused unless owner-only, checked on the open handle) or `--token-fd` (an inherited descriptor). 4 KiB cap. Errors never include the token.']

