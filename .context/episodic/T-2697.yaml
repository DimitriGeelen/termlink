# Summary (auto-generated from git commit messages)
summary: |
  The session handler returns status:'resolved' + a note when there is no PTY, and status:'injected' when there is. T-2580 made the MCP surface status-aware with a LOAD-BEARING test. cmd_inject in pty.rs reads only bytes_len, discards status and note, and prints 'Injected N bytes' / {ok:true} for a no-op — exactly what T-2580's comment says it MUST NOT do (T-2694 F3).

# Key outcomes
outcomes:
  - '`termlink inject` on a session with **no PTY** no longer reports success — it must not print "Injected N bytes" nor `{"ok":true}` when the handler said `status:"resolved"` and nothing reached a terminal'
  - 'The failure carries the handler''s own `note` ("No PTY session. Use `register --shell`…") so the operator gets the actionable remedy, not just a refusal'
  - 'A genuine inject (`status:"injected"`) is unchanged — this must not turn a working PTY inject into a warning'
  - 'Exit code is non-zero on the no-op path, so a script chaining `inject && next-step` stops instead of proceeding on a lie'
  - 'The refusal is LOUD in text mode too, not only in `--json` (the T-2666 silent-exit class: a bare non-zero exit is indistinguishable from a crash)'
  - 'The status-mapping is a pure helper with unit tests, mirroring `mcp_inject_outcome` — so the check is provable rather than only observable'
  - 'Test covers all three shapes: `status:"injected"` → success, `status:"resolved"` → honest failure carrying the note, missing `status` → treated as NOT injected (fail closed)'
  - 'CLI and MCP now agree on this semantic; the divergence T-2580 left behind is closed'
  - '`cargo test --workspace` green'

