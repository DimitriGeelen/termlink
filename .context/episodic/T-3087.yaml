# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-09-25 — NOT_SCHEDULED: which of the two predicates survives'
    chose: 'main''s `is_cron_scheduled()` — greps the crontabs for `\.<name>\.log`, **fails OPEN** on an absent cron dir, and is consulted only inside the STALE branch (heartbeat ancient AND log never written AND nothing schedules it).'
    rationale: 'three independent reasons, all pointing the same way. (1) The anchor is the LOG FILENAME, which is what a crontab necessarily names; the branch''s bare `grep -F <name>` also matches a canary merely *mentioned* in a comment, so it would silence a genuinely stale canary on a coincidence. (2) Fail direction: on an absent cron dir main keeps the old behaviour, while the branch''s variant returns "not declared" for everything — mass-downgrading every real STALE canary to "not a problem" precisely when the check can no longer tell. A guard that goes quiet when it loses its footing is the vacuous-pass class (T-2831). (3) Placement: main only downgrades something already STALE, so the blast radius is the narrower one.'
    alternatives_rejected: ['the branch''s `crontab_declares()`. Nothing in it is unavailable in main''s version, so adopting it would have traded strictness for nothing. Case 8 pins the fail-open direction and Case 13 pins that the rejected predicate has not crept back — if it ever does, two predicates would disagree silently.']
  - decision: '2026-09-25 — migrate 31 scripts, not the branch''s 24'
    chose: 'apply the EXIT-trap heartbeat to every script that writes a heartbeat.'
    rationale: 'main gained six such scripts after the branch forked, and `check-addressed-posts.sh` used a fourth block shape (a local `$hb` rather than `$HEARTBEAT_FILE`) that the sweep''s anchor did not reach. Landing only the branch''s 24 would have reproduced the "hardened in one place, siblings not migrated" divergence that the guard layer exists to catch.'
    alternatives_rejected: ['a literal `git apply` of the branch patch. It would have been cleaner to review but would have left the six newer scripts and the fourth shape behind, and would have missed that the heartbeat regions were byte-identical anyway — which is what made a surgical transform safe.']
  - decision: '2026-09-25 — the chained-trap hazard'
    chose: 'for the four scripts that install their own cleanup `trap ... EXIT` later in the file, use a self-guarding helper armed early and chained onto that later trap.'
    rationale: '`trap ... EXIT` REPLACES any previous EXIT trap. A naive `trap _canary_hb EXIT` at the heartbeat site would have been silently overwritten by the cleanup trap installed further down, stopping those heartbeats entirely and pinning four canaries permanently STALE — a worse failure than the one being fixed, and invisible until someone read /canaries a day later.'
    alternatives_rejected: ['moving the heartbeat call into each cleanup trap only. That leaves an early `exit 2` (before the cleanup trap is installed) with no heartbeat at all.']

