    chose: 'B′ (operator: "B plus the custodial rule plus purpose-intent-over-form … yes to all as suggested"): 1. Private channels are private by default; public channels are public. 2. The hub is a mailman: it reads the envelope (routing, ladder, stuck detection, canaries), not the content; the envelope''s who-talks-to-whom-and-when stays visible (accepted residual). 3. Content is encrypted per message (random content key) and wrapped to each authorised reader''s key (fan-out); separate encryption and signing keys; no shared project private key for readers. 4. A project reads mail addressed to the project and mail that fell back or dead-lettered to it; nothing crosses into another project. 5. Custody rule: each agent''s private mail is also wrapped to a project custody key held by the project''s supervisor, never by sibling agents. The custodian releases an agent''s mail to a successor only when the home hub has declared the agent DEAD (R-44/R-60) AND the successor has taken over that agent''s role in the same project under the R-67 lease by the explicit hand-over of R-62. While the original is alive, nothing is released (no duplicate work, continuity of the chain). Every release is logged (what, to whom). A resumed agent (R-65, same identity) reads its own mail with its own key. 6. The hub keeps an encrypted copy with BOUNDED retention, so a lost receiver store can be recovered (OQ-5 F-5). 7. Break-glass: an off-host operator key to which message keys are wrapped in advance, scoped and logged unlock; NOT real until GP-11 (today''s Tier 0 hook does not bind root). 8. Build order for step 4 to size: pin hub card-signing keys out of band first; then agent-to-agent DM encryption; then project mail; break-glass after GP-11. Receiver-side "show my own mail" tooling for debugging.'
    alternatives_rejected: ['A (siblings read each other''s mail; undoes OQ-2), C (every sender picks readers), D (keeps "everyone with a token reads everything").']
