    chose: 'A as the default when no rule says otherwise, plus a boundary model (operator: "Yes, that''s the ruling, with your recommended default"): 1. Join: an existing participant''s signed event, countersigned by the newcomer; leave: self; epochs and fencing as PR-30. 2. Agent profile settings: may invite; may be invited (a gate, refusals visible to the inviter); responds to invitations (accept automatically / ask = Tier 0 event / decline; unanswered invitations expire visibly); may remove (nobody by default / those it invited / anyone in conversations it started). 3. Rules = who (agent, agent type, identity level) may do what (invite, be invited, auto-accept, remove) towards whom, where (conversation, project, hub, fleet). Rules nest fleet > hub > project > agent profile; a lower level may only narrow. Outside the boundaries: a Tier 0 event (OQ-8 routes), never a silent refusal; a recurring approval can be turned into a rule. 4. Rules are signed policy records (SI-21); only the operator or an approved route changes them; an agent never edits its own boundaries. Every decision names the rule that allowed it. Small fixed vocabulary, no free-form expressions. Same engine as OQ-8''s policy route. 5. Default when nothing is configured: may invite yes; may be invited yes; respond = accept automatically from its own project, ask for anyone else; may remove = nobody. Removal outside a profile = Tier 0 event.'
