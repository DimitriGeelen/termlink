# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-22 — two layers on the tmux path, not one'
    chose: 'clear the tmux client''s environment AND wrap the session command in `/usr/bin/env -i <allowed> /bin/sh -c`.'
    rationale: 'clearing the client only protects a server our spawn starts. A server someone else already polluted still hands its global environment to every new session; only the wrapper covers that, and the live test shows it.'
    alternatives_rejected: ['`new-session -e` per variable (cannot unset a polluted global); clearing the client alone.']
  - decision: '2026-10-22 — the caller''s project variables are no longer forwarded'
    chose: 'forward nothing project-scoped; project values come only from the launch spec (`--env`, `--workdir`, the cwd). `tl-claude.sh oneshot` now passes `TERMLINK_AGENT_ID`, `TERMLINK_SIDECAR_SOCKET` and `IS_SANDBOX` with `--env`.'
    rationale: 'operator ruling A: "from the target''s validated launch spec, not from the spawning agent". T-3445 forwarded the caller''s `PROJECT_ROOT` even to `dispatch --workdir /opt/other` (antigravity review).'
    alternatives_rejected: ['forwarding when the target is "the same project" (needs a project resolver here; that is T-3551''s job).']
  - decision: '2026-10-22 — fixed PATH, not the caller''s'
    chose: 'the binary''s own dir, `$HOME/.local/bin`, `$HOME/.cargo/bin`, then system dirs.'
    rationale: 'a project can put its own `.agentic-framework/bin` first on PATH, and a child would run that project''s `fw`.'
    alternatives_rejected: ['passing PATH through (a leak vector); a pure system PATH (loses `claude` and `termlink`). A session that needs more passes `--env PATH=...`.']
  - decision: '2026-10-22 — the hub'
    chose: '`hub restart` (CLI and MCP) starts the hub with the allow-list plus the caller''s `TERMLINK_*` settings.'
    rationale: 'the hub starts no child processes (grep over `crates/termlink-hub` finds no `Command`), so its environment cannot reach a session; hub tuning variables (`TERMLINK_MAX_CONNECTIONS`, ...) are too many to list. The systemd unit already gives the hub a clean environment (`Environment=` lines only).'
  - decision: '2026-10-22 — what is not changed'

