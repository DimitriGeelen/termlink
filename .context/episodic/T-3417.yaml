# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-12 — Which account runs the sidecars in the acceptance (left open by the handover)'
    chose: 'the whole run is unprivileged. The test binary runs as `testdev` under `strace -f`, so the throwaway hub, both sidecars, both Claude sessions, the hooks and the finalizers all run as testdev. The agents keep testdev''s HOME and own login; only the sidecars'' HOME is in the estate, and `Config.claude_projects` points them at testdev''s transcripts.'
    rationale: 'the sidecar''s SO_PEERCRED owner check (PR-8) refuses another uid, so sidecars running as root would refuse testdev''s hooks. Running everything unprivileged also means the kernel itself keeps the run away from root''s files (`/var/lib/termlink` came back EACCES), and the strace audit covers every process.'
    alternatives_rejected: ['sidecars as root with the owner check relaxed. It would weaken the control the run is meant to show, for a test convenience.']
  - decision: '2026-10-12 — Keeping repository lookups inside the estate'
    chose: 'run `git init` in each estate project dir, and also set `GIT_CEILING_DIRECTORIES`.'
    rationale: 'X4 showed Claude Code''s own repository lookup climbing to the host''s `/.git` (a repository at `/` on .107) and reading files under `/`. Claude Code ignores the ceiling variable; a repository in the project dir stops every lookup. After the change, one read is left outside the estate (`/.git/info/exclude`), and the report lists it.'
    alternatives_rejected: ['counting reads of world-readable files outside the estate as acceptable without fixing them. The audit exists to make the boundary visible, not to explain it away.']

