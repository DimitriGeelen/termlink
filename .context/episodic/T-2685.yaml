# Summary (auto-generated from git commit messages)
summary: |
  All 19 canary cron job lines use '>> findings.log 2>&1', merging exit-2 tooling errors into the exit-1 findings log and destroying the empty-log-means-healthy contract (T-2683 F2/G2+G3). Live false positive on release-mirror. Split stderr to a sibling log and guard the idiom.

# Key outcomes
outcomes:
  - 'Every canary cron job line routes stderr to a sibling `<log>.stderr` instead of merging it into the findings log with `2>&1` — the tooling stream is preserved, never discarded, and never mistaken for a finding'
  - 'All 24 git-tracked crontabs are migrated; zero remaining `>> <findings>.log 2>&1` job lines'
  - 'The sibling `.stderr` path does not match `/canaries`'' `.*-canary.log` discovery glob, so it cannot be read as a findings log'
  - 'The polluted `.release-mirror-canary.log` is truncated, but only after independently confirming the mirror is actually synced (never blind-truncate a findings log)'
  - '`scripts/check-canary-log-hygiene.sh` fires on any crontab job line that merges stderr into a findings log — G-019 half: the next canary written with the old idiom is caught, not silently reintroduced'
  - 'The hygiene check is a member of the T-2684 guard layer (`# guard-layer: source` marker) so it runs with everything else'
  - 'Hygiene check exit codes: 0 = clean, 1 = a merging job line, 2 = tooling; `--json` for scripting; test seam `CANARY_HYGIENE_SRC_DIR` for hermetic fixtures'
  - 'The check only flags *findings* logs — an operator appending stderr to a scratch/debug log is not the defect and must not fire'
  - 'Fixture suite `tests/canary-log-hygiene-fixtures.sh` covers: merging line fires, split line passes, a `2>/dev/null` discard fires (loses diagnostics), non-canary redirect ignored, absent dir is a tooling error'
  - 'Load-bearing: reintroducing `2>&1` into any crontab makes the check fire; restoring returns it to clean'

