# Key outcomes
outcomes:
  - '`scripts/gate-inception-voi.sh` fires on an inception whose `voi_score` is absent or the untouched `0.5` template default, and exits non-zero so it can serve as a blocking PreToolUse hook'
  - '**Override exists and is durable**: `voi_score_waived: "<reason>"` in the task frontmatter clears the gate. An EMPTY or missing reason does NOT clear it — a waiver without a reason is not a waiver'
  - '**Override is logged, never silent** — every waiver and every env-bypass is appended to a git-tracked ledger with task id, reason and timestamp, so bypass volume is countable'
  - '**Grandfathered**: tasks created before the cutoff do not fire. Measured: 244 of 245 existing inceptions carry default-or-absent, so an ungrandfathered gate would block a quarter of the backlog on day one'
  - 'Non-inception tasks never fire, and a task with a real considered value never fires'
  - '**Fail-open on unreadable input**: a malformed or unparseable task file must not block the operator''s work — this gate protects a ranking number, not a safety property, and blocking on its own bug would be worse than the defect'
  - 'Fixtures `tests/inception-voi-gate-fixtures.sh` pass, weighted to the firing and override cases, with a mutant that disables the waiver check and must let an unreasoned waiver through'
  - 'Carries `# guard-layer: source` so CI runs it, and `run-guard-layer.sh --list` shows it'
  - 'The settings.json wiring that makes it BLOCKING is written out for operator approval, NOT applied — `.claude/settings.json` is the root of all enforcement'

