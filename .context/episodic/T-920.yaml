body: "# ============================================================================\n# EPISODIC MEMORY - T-920: Expose termlink remote CLI family + hub TCP as MCP tools\n# ============================================================================\n# STATUS: AUTO-GENERATED\n# Hybrid episodic: git-mined timeline/metrics + task-file decisions/AC.\n# Generated: 2026-04-11T19:40:01Z\n# ============================================================================\n\ntask_id: T-920\ntask_name: \"Expose termlink remote CLI family + hub TCP as MCP tools\"\nworkflow_type: build\nenrichment_status: complete  # AC checked + decisions recorded\n\n# Timeline\ncreated: 2026-04-11T19:32:03Z\ncompleted: 2026-04-11T19:40:00Z\nduration_days: 0\nupdates_count: 2\nfirst_commit: 2026-04-11T21:39:56+02:00\nlast_commit: 2026-04-11T21:39:56+02:00\n\n# Summary (auto-generated from git commit messages)\nsummary: |\n  Expose hub TCP + cross-host RPC as MCP tools (closes discovery gap)\n\n# Key outcomes\noutcomes:\n  - \"`termlink_hub_start` MCP tool accepts an optional `tcp_addr` parameter and starts the hub with TCP binding when set (calls `termlink_hub::server::run_with_tcp` instead of `run` when provided)\"\n  - \"`termlink_remote_call` MCP tool exists — generic wrapper over `connect_remote_hub` + `rpc_client.call`, accepts `hub`, `method`, `params`, `secret_file?`, `secret?`, `scope?`, `timeout?`; returns the full RPC result as JSON. This single tool exposes every hub RPC method (session.discover, termlink.ping, command.inject, hub.auth, event.broadcast, etc.) over the network.\"\n  - \"`termlink_remote_ping` MCP tool — convenience wrapper for the common \\\"is this hub/session alive?\\\" flow\"\n  - \"`termlink_remote_inject` MCP tool — convenience wrapper for the high-value \\\"inject text into remote session\\\" flow\"\n  - \"`termlink_doctor` reports hub transport (Unix-only vs TCP+Unix) so an MCP agent can tell whether cross-host is available\"\n  - \"`termlink_overview` / `termlink_help` lists a new \\\"remote\\\" group so agents can discover the new tools\"\n  - \"Param deserialization tests for every new MCP tool (same pattern as `dispatch_params_*` tests in tools.rs)\"\n  - \"`cargo build --workspace` clean\"\n  - \"`cargo test -p termlink-mcp` passes\"\n\n# Challenges (auto-detected from git: commits with fix/revert/bug/error)\nchallenges:\n  # No challenges detected in commit messages\n\n# Decisions (from task file Decisions section)\ndecisions:\n    chose: \"One generic `termlink_remote_call` tool + 2 convenience wrappers (`termlink_remote_ping`, `termlink_remote_inject`)\"\n    rationale: \"Every termlink feature is already reachable as a hub RPC method. A generic wrapper exposes ALL of them in one code path; adding a new hub method automatically makes it MCP-reachable cross-host. Matches the `connect_remote_hub` pattern already proven in `commands/remote.rs`. Minimizes duplication, maximises surface area.\"\n    alternatives_rejected: [\"8 individual per-command tools (list, status, send-file, exec, profile-add/list/remove). Higher code volume for strictly less coverage — the convenience tools pay off only for the most common flows, the generic tool pays off for everything else. Can still add per-command tools later if specific flows warrant it.\"]\n  - decision: \"[date] — [topic]\"\n    chose: \"[what was decided]\"\n    rationale: \"[rationale]\"\n    alternatives_rejected: [\"[alternatives and why not]\"]\n\n# Artifacts (auto-mined from git --name-only)\nartifacts:\n  - \"crates/termlink-mcp/src/tools.rs\"\n  - \".tasks/active/T-920-expose-termlink-remote-cli-family--hub-t.md\"\n  - \".tasks/active/T-921-full-cross-host-parity--every-termlink-c.md\"\n  - \".tasks/active/T-922-codify-mcp-auto-exposure--every-new-cli-.md\"\n\n# Timeline (auto-mined from git log)\ngit_timeline:\n  - time: \"2026-04-11T21:39:56\"\n    action: \"T-920: Expose hub TCP + cross-host RPC as MCP tools (closes discovery gap)\"\n\n# What worked well (requires judgment — [TODO] if enrichment_status is pending)\nsuccesses:\n  # Completed successfully in 1 commit(s), 7 min\n\n# Related tasks\nrelated_tasks:\n  blocked: []\n  absorbed: []\n  spawned: []\n\n# Tags for retrieval\ntags: []\n\n# Passive metrics (derived automatically — do not edit)\nmetrics:\n  wall_clock_minutes: 7\n  commits: 1\n  files_changed: 4\n  lines_added: 803\n  lines_removed: 8\n\n# Metadata\nsource_file: /opt/termlink/.tasks/completed/T-920-expose-termlink-remote-cli-family--hub-t.md\ngenerated_by: context-agent-hybrid"
