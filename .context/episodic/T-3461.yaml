# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-18 — Deployed'
  - decision: '2026-10-18 — How durable the hub''s "accepted" is (operator ruling)'
    chose: 'A, strengthened by the operator''s rule: **every "accepted" signal in the flow is sent only once the message is actually stored.** For the hub: WAL + `synchronous=FULL`, the payload flushed too (closes the T-2464 gap), all of it off the async workers. Sender-side resend stays as the safety net (separate task), keyed to the existing R-44.e accept deadlines (60 s normal, 15 s urgent), bounded attempts with growing gaps, then needs-attention; message-id dedupe at hub and recipient prevents duplicates.'
    rationale: 'an "accepted" that is not stored is a false signal: the sender stops trying and the message can vanish silently. The recipient sidecar already reports STORED only after its own fsync (pull.rs:424-426, store.rs:649-669); the hub now meets the same bar. The stall is fixed by moving the flush off the threads that accept connections, not by flushing less.'
    alternatives_rejected: ['B (WAL + NORMAL: the hub would say accepted before the data is safe); C (only move writes off the workers: posts still wait seconds on the lock); D (defer: messages are being lost now).']
  - decision: '2026-10-18 — How to get the writes off the workers'
    chose: '`block_in_place` around every meta connection access and the payload write+fsync (`run_blocking` in lib.rs; inline on a current-thread runtime or outside one).'
    rationale: 'the stall is every worker parking, not one: the fsyncing commit holds the std mutex, and every other handler then blocks on that mutex on its own worker. Wrapping only the commit would leave those waiters parking workers. `block_in_place` hands the worker''s queue to a fresh thread before blocking, so it covers the waiters too, needs no `''static` closures (the 36 meta methods keep `&self`), and costs ~tens of µs per call (reads measured at p50 76 µs total).'
    alternatives_rejected: ['`spawn_blocking` (needs owned/''static data, an Arc<Meta> refactor of 36 methods for the same effect); a dedicated writer thread (a larger redesign; worth it only if group commit becomes necessary); a separate read connection (helps reads, not the parked waiters on the write lock).']

