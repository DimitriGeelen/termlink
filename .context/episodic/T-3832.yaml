# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-11-21 — 3.6 card inputs and 3.8.2 scope (agent choices, overturnable)'
    chose: '1. `adapter_present` reads the meter''s report log on disk (newest applied or dropped line), not the meter''s in-memory record, so a sidecar restart does not show a present adapter as absent until the agent''s next hook. 2. The 3.8.2 override applies to every STUCK or UNKNOWN label on a sent message once the recipient''s card has expired, including after hand-over. An unreadable hub or a missing card never counts as expired. 3. 3.6.4 (other projects see only reachable yes/no and the version class) needs the PH-3 read scope. In PH-2 the card carries no secret content; the restriction is recorded here as a PH-3 item.'
    rationale: 'an offline recipient cannot be STUCK, and our own read failure must not be reported as the recipient''s absence.'
    alternatives_rejected: ['the in-memory meter record (wrong after every restart); reading every book peer''s card (the recipients actually sent to are the ones whose status shows it).']
  - decision: '2026-11-21 — 3.8.3 how the cut is made (agent choice, overturnable)'
    chose: 'a fault proxy on the throwaway hub''s unix socket. The estate hub listens only on a unix socket, so the cut is made at the transport. The hub stays up throughout, so its in-memory `client_msg_id` dedupe is what gets tested.'
    rationale: 'the design names "netns or firewall rule". Neither applies to a unix socket, and both would change host network state from a test (forbidden). The proxy also stages the one case that creates duplicates, a post the hub took whose reply was lost, which a plain firewall drop would only hit by chance.'
    alternatives_rejected: ['iptables or netns (host state, and not applicable to a unix-socket hub); stopping the hub (that is 3.8.1''s test, and it also clears the dedupe).']

