# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-11-12 — How reports are ordered (P-2)'
    chose: '`ReportOrd {boot, ns}`: the adapter''s `(boot_id, mono_ns)` when both are present and valid, else the receive stamp in its own domain `rx:` (`:` cannot occur in a `boot_id`). Same domain: higher `ns` is later; another domain (a new boot, or a switch between adapter and receive stamps) is later than every report of the previous one (04 17.2.a). Used for READY (FCW-3, tie keeps BUSY), for `last_prompt` (an older prompt is dropped, counted `prompt_reordered`, as 17.2.a names both keys) and for "the stop ordered after the prompt" (AL-4 line 510). `at_ms` is kept for display only. The order is persisted with P-1''s record; a P-1 file without it is read back with its receive stamp.'
    rationale: '06 v0.3 AL-1 CR-6.24, 04 v0.4 17.2.a. The receive-stamp fallback applies now, before any adapter sends the fields, so the clock-step freeze is gone for every report today.'
    alternatives_rejected: ['comparing adapter `mono_ns` (CLOCK_BOOTTIME) with the receiver''s CLOCK_MONOTONIC receive stamp in one domain (different clocks; they drift apart over suspend).']
  - decision: '2026-11-12 — `mono_ns` may be a decimal string; the hooks send a string'
    chose: 'accept `mono_ns` as a JSON integer or a decimal string (1..=20 digits); the built hooks send the string form.'
    rationale: 'a u64 in ns passes 2^53 after about 104 days of uptime, and strict JSON (06 3.3) refuses larger integers, which would make every report on a long-running host unparseable. The design does not fix the field''s type. **For P-44 (AEF''s adapter):** send the string form, or the integer only while it fits; the parity fixtures should carry both.'
    alternatives_rejected: ['integer only (breaks after ~104 days of uptime); ms resolution (loses the ordering of reports less than 1 ms apart).']
  - decision: '2026-11-12 — Hooks stay compatible with a sidecar started before P-2'
    chose: 'the `ready` and `pull` ops accept `boot_id` and `mono_ns`; a hook that gets `unknown-field` asks once more without them.'
    rationale: 'the API refuses unknown fields per op, so after an upgrade a still-running old sidecar daemon would refuse every hook call, including `pull` (mail hand-over), until it restarts. The retry costs one extra local call only in that window.'
    alternatives_rejected: ['requiring a sidecar restart with the upgrade (the operator''s rule: a working route is not switched off as a side effect of an upgrade).']

