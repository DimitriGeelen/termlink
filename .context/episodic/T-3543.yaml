# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-23 — a token below the command''s scope: note, not a local refusal'
    chose: 'the node refuses an expired token itself (naming file, expiry, remedy), but a token below the scope a command asks for only prints a note naming the file and its scope; the hub then refuses any method above it with its "SCOPE mismatch" error.'
    rationale: 'many callers ask for a scope higher than they use (fleet doctor/governor probes default to `execute` but only need `hub.auth` + observe reads). A local refusal would block exactly the probes a token node should be able to run.'
    alternatives_rejected: ['refusing locally on any scope shortfall (breaks fleet doctor on token nodes); silent pass-through (the user gets a bare hub refusal with no hint which file to replace).']
  - decision: '2026-10-23 — precedence when a profile has both a secret and a token_file'
    chose: 'the secret wins; token_file is used only when no secret is configured or passed.'
    rationale: 'keeps every existing profile''s behaviour byte-identical; `profile add` rejects passing both at once.'

