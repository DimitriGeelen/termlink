outcomes:
  - 'Hypothesis tested before any hub change: an A/B on a scratch copy of meta.db on the same filesystem, timing each note_fetch-shaped commit at `synchronous=NORMAL` with the default auto-checkpoint vs `wal_autocheckpoint=0`, with the result (counts, p99, max, >1 s) recorded here. A result that does not separate the modes is recorded as disproving the hypothesis, and the task changes course. **Result (2026-10-22, load 75, 5000 commits each, script kept at the scratchpad path in Updates):** A default p50 0.1 ms, p99 15.5 ms, max 441 ms, 7 over 100 ms, 0 over 1 s; B `wal_autocheckpoint=0` p50 0.1 ms, p99 10.8 ms, max 142 ms, 3 over 100 ms, 0 over 1 s. The checkpoint costs at most a few hundred ms; it **does not explain** holds of tens of seconds. The hypothesis is disproved as the main cause'
