  - 'The remaining levers are operator decisions, and they are recorded on T-3488 rather than built here: (a) group commit / fewer fsyncs per post, which revisits T-3461''s durability ruling; (b) the bus store on a filesystem with lower fsync latency, which is host configuration. Nothing in the hub was changed by this task'

