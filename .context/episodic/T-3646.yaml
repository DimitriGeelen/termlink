# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-11-01 — topic, note shape, constants'
    chose: 'topic `liveness:<hub_id>/<agent>` (named like the inbox `inbox:<hub_id>/<agent>`, `send::inbox_topic`), created with retention `messages:100`; note `sidecar.liveness.v1` = `{agent, instance, sample_ms, drained_up_to, receiving}`, signed with the agent''s own key and posted directly (`Sender::post_note`), never through the durable outbox: a lost note is replaced by the next one. `drained_up_to` is the inbox cursor: every offset below it is handled. Constants in `liveness.rs`: `NOTE_EVERY_MS = 60_000`, `STALE_AFTER_MS = 300_000` (five missed notes). Test seams only, honoured in a test estate and never in production (same rule as `beat::test_overrides`): `TERMLINK_SIDECAR_TEST_LIVENESS_EVERY_MS`, `TERMLINK_SIDECAR_TEST_LIVENESS_STALE_MS`. No config knob.'
    rationale: 'reuses the hub''s existing signed channel.post / channel.list (`latest_offset`) / channel.subscribe; the topic stays bounded; 60 s matches the brief''s example and 5 min tolerates hub blips without a false alarm.'
    alternatives_rejected: ['the durable outbox (it would queue notes while the hub is down and post them late as if current); `LatestPerCvKey` retention (needs cv-key metadata for no gain over reading `latest_offset`).']
  - decision: '2026-11-01 — what "stuck" means, and what is unknown'
    chose: '`stuck` = the note is fresh, but at the note''s own sample time the main''s inbox held a message at or past `drained_up_to` that had already been on the hub longer than the threshold. A draining main would have passed it, so this is "N stopped advancing while mail waits" without the peer having to remember N. `unknown` covers no book, no pinned main, no note yet, hub unreadable (any failed call, including the inbox read), an unparseable note, a note from another agent or instance, a signer that is neither in the roster nor this agent, a note dated in the future, and this sidecar''s own check not having run within three intervals.'
    rationale: 'fail-closed as the AC demands; comparing the waiting message with the note''s sample time avoids needing peer-side memory of N across restarts.'

