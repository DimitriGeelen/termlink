# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-12 — The Stop hook does not pull'
    chose: 'Stop (and SessionStart) only record the session as ready.'
    rationale: 'without `decision: block` (excluded in PH-1) a Stop hook cannot hand text to the agent, so a claim taken there could never be evidenced and would sit UNCERTAIN; under OP-21 B mail waits for the next tool call.'
    alternatives_rejected: ['pull on Stop (claims that can never reach the agent).']
  - decision: '2026-10-12 — Hooks live in the `termlink-sidecar` binary'
    chose: '`termlink-sidecar start|hook|finalize` instead of a `termlink sidecar` subcommand.'
    rationale: 'PH-1 is estate-only; adding a subcommand to the production `termlink` CLI is not needed to prove the design and would put PH-1 code in the shipped binary.'
    alternatives_rejected: ['`termlink-cli/commands/sidecar.rs` now (revisit when PH-1 is accepted).']
  - decision: '2026-10-12 — Live check registers the transcript'
    chose: 'the live test fixes `--session-id` and tells the sidecar the transcript location, because Claude runs with the operator''s HOME (no credential in the estate HOME, OQ-3).'
    rationale: 'the alternative (copying the operator''s credential into the estate) is exactly what E-7 forbids.'

