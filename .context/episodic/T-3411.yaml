# Key outcomes
outcomes:
  - '`termlink-sidecar start --config <file>` runs inside the estate guard: opens the store (lock), the send pump, the receive loop, the deliverer and the three API sockets; stops cleanly on SIGTERM/SIGINT'
  - '`termlink-sidecar hook post-tool-use` reads the hook input from stdin, calls `pull` with the session and tool_use_id, prints `{"hookSpecificOutput":{"hookEventName":"PostToolUse","additionalContext":<frame>}}` only when a frame came back, and spawns a detached finalizer (`termlink-sidecar finalize`) that polls `handed-over` and ends with a final check'
  - '`hook session-start` and `hook stop` record the session as ready (the flag the PH-2 doorbell will read); Stop does not pull (it cannot hand text to the agent without blocking the turn); the transcript is resolved by the sidecar under its own HOME, never from a path sent over the socket'
  - 'The turn fails open: sidecar down, socket error or timeout makes the hook print nothing, exit 0 and append a line to `hook-errors.log`; the message stays STORED (6.3)'
  - 'FC-5: a missing, empty, unreadable or stale ready flag reads not ready'
  - 'FC-6/FC-7: on the sender, a message at STORED with no HANDED_OVER shows WAITING FOR RECIPIENT, and STUCK after the deadline (simulated clock)'
  - '`scripts/arc011-ph1-demo.sh --scripted` exits 0: two real sidecar processes in a throwaway estate, a message sent, the hook command run with a scripted hook input, a scripted transcript record, and the sender''s status reaching HANDED_OVER'
  - 'Live check run once: a real `claude -p` with the hook surfaces the pending frame in its transcript as `hook_additional_context` and the sidecar records HANDED_OVER; result written to `docs/reports/arc011-ph1-b10-live-hook.md`'
  - '`cargo test -p termlink-sidecar --test hooks_tests` passes and the full suite stays green; no production path is touched'

