# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-09-16 — the general pass is marker-only; the unclassified bucket stays name-shaped'
    chose: 'the new `scripts/*.sh` pass adds a file to the layer when it carries the marker and says nothing at all when it does not.'
    rationale: '`scripts/` holds 190 `.sh` files, mostly operator tooling. `unclassified` means "looks like a guard but forgot its marker" — a judgement the *name* carries. Extending it to every general script would add ~130 entries and destroy that meaning. It would also trip the detector''s INVENTORY AGREEMENT gate, which exits 2 on unclassified-count drift.'
    alternatives_rejected: ['report unmarked `scripts/*.sh` as unclassified — symmetrical-looking, and it manufactures exactly the alarm fatigue T-2818 documented, inside the accounting layer.']
  - decision: '2026-09-16 — the detector checks the invariant, not a copy of the runner''s globs'
    chose: 'widen only the MARKED scan, then diff it against the runner''s actual `--list --json` member names, reporting the difference as a firing `unenumerated` class.'
    rationale: 'the original defect *was* a copy of the globs drifting from the contract. Mirroring the new globs into the detector recreates the same coupling one commit later and would go stale the same silent way. Comparing against the authority''s real output tests the property that matters — declared membership is honoured — and survives the globs changing again.'
    alternatives_rejected: ['mirror the new `scripts/*.sh` glob in the detector. Cheaper, and it would have reported clean for exactly as long as the two copies happened to agree.']
  - decision: '2026-09-16 — the fixture mutates the RUNNER, not the check'
    chose: 'build a pre-fix runner (new pass''s glob neutered to `__no_such_glob__*.sh`) and point the check at it via `GUARD_COVERAGE_RUNNER`.'
    rationale: 'AC4 asks whether the fixture detects the regression. The regression lives in the runner''s enumeration, so the runner is what has to break. Against it the check fires and names both dropped scripts; against the fixed runner the class is 0.'
    alternatives_rejected: ['mutate the check (the suite''s existing M1-M3 style). That proves the assertion executes, not that it catches the defect — the weaker claim, and the one already covered.']
  - decision: '2026-09-16 — gate the dormant disposition advice instead of leaving it'
    chose: 'print the "give each dormant script a disposition" block only when `n_dormant > 0`.'
    rationale: 'it ends by telling the operator to *add the `# guard-layer: source` marker*, which is wrong for every member of the new class — those scripts already carry one. Wrong advice in a firing message is worse than none: it sends the reader to change the one thing that is already correct.'
    alternatives_rejected: ['leave it unconditional. Found while wiring the output rather than by a failing assertion, which is why it is recorded here rather than silently patched.']

