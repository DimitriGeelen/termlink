# Decisions (from task file Decisions section)
decisions:
  - decision: '2026-10-02 — D1: hub handling of a bare "forever" create (operator ruling)'
    chose: 'D+ — accept and label as `unowned_forever` now; enforcement (refuse) switches on automatically after 14 days with no bare-forever create; backstop canary on 2026-11-15 that files a task if enforcement is still off or a hub opts out; opt-out `TERMLINK_FOREVER_REQUIRES_OWNER=never` stays possible but is reported daily; fixture tests and a mutant pin the auto-flip. revisit_at 2026-11-15 as the human reminder.'
    rationale: 'every current client and every old binary sends forever explicitly and cannot send an owner, so a strict refusal breaks unattended agents'' posts to new topics on day one; a silent downgrade loses mail older than 14 days without telling the sender (Directive #2). The operator accepted D but called the "switch stays off forever" strawman valid, so the flip is driven by measured fleet behaviour, not by memory, with an action-filing backstop.'
    alternatives_rejected: ['A refuse now (breaks fleet, score -44); B silent downgrade to 14 d (-9, silent loss); C label only (+37, no path to enforcement). D scored +46 before the layers. - **Assumed (overturnable):** the 14-day quiet window and the 2026-11-15 backstop date were agent proposals; the operator accepted them unchanged. - **Left open:** D2 new-client defaults (incl. `inbox:*` / `dm:*`), D3 meaning of "2x its limit" for day-based topics.']
  - decision: '2026-10-02 — D2: what new clients ask for by default (operator ruling)'
    chose: 'B — mail by count, everything else by age: `inbox:*` and `dm:*` default to Messages(1000) (the bound the hub inbox mirror, `hub channel.rs:243`, and the CLI `dm:*` path, `channel.rs:2806`, already apply); every other new topic, including `sidecar:*`, defaults to Days(14); existing exceptions kept (`state:*` Latest, debris Days(7), presence/chat topics Messages(1000)). One shared table for CLI create, auto-create and MCP create.'
    rationale: 'bounds every topic while mail is never deleted for being unread, only when outnumbered, and a reader that falls behind a trim is told (T-3307/T-3308 gap signal).'
    alternatives_rejected: ['A uniform 14 d (-11: deletes unread mail, hides rail outages); C mail forever with automatic owner (+21: rubber-stamp ownership reopens forever-by-default); D keep-until-read (+11: depends on T-3309 read data that is a lead, not a verdict, and is the most code). B scored +46. - **Left open:** D3, the meaning of "2x its limit" for the post-time ceiling (sets the real margin before a mail trim).']
  - decision: '2026-10-02 — D3: ceilings checked on post (operator ruling)'
    chose: 'C — count, age and live-size ceilings on post, read from a hub config file and changeable per topic; 2x hysteresis (trim at 2x, back to 1x). Defaults: Messages(N) 2N; Days topics 10,000 records and oldest past 2x window; 64 MB live for bounded topics; Latest/LPCK compact past 10,000; Forever warn-only at 10,000 / 64 MB, never deleted. Disk reclamation (rewrite a log over 8 MB and more than half dead, offsets unchanged) is its own build task.'
    rationale: 'operator asked for count + age + size, configurable. Measured 2026-10-02: sweeps delete index rows but log files never shrink (agent-presence 31.6 MB on disk vs 0.55 MB live, ~98% dead; bus 49 MB on disk vs 12.4 MB live), so only C bounds disk too.'
    alternatives_rejected: ['A count only (+28: large payloads evade it); B no reclamation (+37: disk still grows); D rely on sweeper (-20: off on .122/.121). C +41, reliability scored +1 for rewrite risk. - **Assumed (overturnable):** all numbers are agent proposals accepted unchanged. - **Operator side-points recorded as inceptions:** T-3319 learn from message traffic (now), T-3320 settings surface (next), T-3321 compaction (later, DEFER behind T-3319).']

