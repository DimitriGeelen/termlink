# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-11-13 — shape of the registration capability'
    chose: 'a signed `reg: {principal, prefix}` claim inside the existing hub token, minted at observe scope. The hub binds the connection to the principal and routes the three registration methods through owner checks.'
    rationale: 'it reuses the existing HMAC token, file and `hub.auth` path. An old hub ignores the unknown field and sees a plain observe token, so it refuses registration (fails closed). An old token has no claim, so nothing changes for it.'
    alternatives_rejected: ['a new `PermissionScope::Register` tier, because scopes are a strict hierarchy and "may register only its own names" is not a rank. Handing the user an interact token, because that allows impersonation and takeover.']
  - decision: '2026-11-13 — endpoint validation'
    chose: 'the endpoint host must equal the caller''s own IP as the hub sees it (IPv4-mapped forms are treated as equal), with port 1024-65535.'
    rationale: 'a claim holder can then point the hub only at its own machine and at a port it could bind without root.'
    alternatives_rejected: ['liveness-probing the endpoint at registration time. It proves nothing about who owns the port and adds a hub-side outbound connect per request.']
  - decision: '2026-11-13 — capability expiry (OPEN for the operator; proposal only)'
    rationale: 'the token is checked at `hub.auth` (connect and reconnect). Records are separately bounded by the 300 s hub lease, so a stopped worker disappears within 5 minutes whatever the expiry. Expiry therefore only limits how long a stolen token file stays usable.'

