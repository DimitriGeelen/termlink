# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-11-19 — How the hub identifies an inbox reader (F-1): E, named + signed reads (operator ruling)'
    chose: 'E (A+B). Every inbox read and claim carries the reader''s agent name; a reader with a key card also signs the read (inbox, cursor, timestamp, hub id; the key it signs posts with) and the hub checks it against the card. Each consumer is listed `proven` or `claimed`. Before a bind unsigned readers are allowed, listed `claimed`, flagged. After a bind only reads signed with the bound agent''s key pass; a matching name alone is refused.'
    rationale: 'reads carry no caller identity today (spec extract F-1), so the design''s "[B] authenticated caller" does not hold. A alone cannot tell two copies of one agent name apart (V-12); E can, and a bind holds by key, not name. Root on .107 can still read key files; E closes that when PH-4 accounts arrive, without rework. Operator, on the first brief: "A still doesn''t solve a problem that everybody can be" — the brief had omitted A+B; added as E and rescored (A +28, B +17, C −27, E +39).'
    alternatives_rejected: ['A (names only: spoofable, misses a same-name second copy); B (signed only: every key-less tool refused outright, no `claimed` visibility); C (postpone to PH-4: BP-15 stays invisible, blocks P-24/P-36/G-2). - **Left open:** the rule for the operator''s diagnostic peeks (CLI/MCP inbox reads) — to be proposed in the design and brought back; each bind remains an operator runme action. Design text 06a 2.14.h is corrected under this task.']
  - decision: '2026-11-19 — Key-less diagnostic reads of an inbox: D, peek through the agent''s own sidecar (operator ruling)'
    chose: 'D. A sidecar `peek` verb reads the inbox with the sidecar''s own signed reader and does not advance it. Direct key-less reads (CLI `channel subscribe`, MCP `channel_state`, AEF `fw sidecar inbox --peek` today) are treated like any reader: listed `claimed`, flagged, refused after a bind.'
    rationale: 'keeps the operator''s ability to look without opening the BP-15 hole (a self-labelled "observer" is the 2026-10-06 incident again). Scores D +32, A +6, C −5, B −6.'
    alternatives_rejected: ['A (no peek path: alarms on every look, none after a bind); B (self-declared observer: reopens BP-15); C (local root as observer: on .107 everything is root, so it exempts exactly where the incident happened). - **Follow-ons:** ask AEF over TermLink to route `fw sidecar inbox --peek` through the sidecar (their code) — asked 2026-11-19 (conv t3700-peek-route); AEF said yes, tracked as their T-5281, waiting on us to post the version with `termlink sidecar peek` once live; confirm in the build that AEF''s inbox route and the arc-011 agent inbox are different topics (`termlink` vs `claude-termlink`).']

