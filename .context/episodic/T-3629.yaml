# Summary (auto-generated from git commit messages)
summary: |
  Reported by the codex seat in the T-3628 consultation (docs/reports/T-3628-consult/codex.md item 4), confirmed 2026-10-29 by reading crates/termlink-session/src/tofu.rs:371-388: TofuVerifier::verify_tls12_signature and verify_tls13_signature return HandshakeSignatureValid::assertion() without verifying. The pin compares only the public leaf certificate (sent in every handshake), so a party that replays a hub's real certificate can complete TLS without the private key and pass the pin. Fix: verify with rustls' provider (rustls::crypto::verify_tls12_signature / verify_tls13_signature with the provider's signature_verification_algorithms), restrict supported_verify_schemes to the provider's; regression test: a handshake presenting a pinned cert with a different key must fail. Then assess exposure of hub auth (HMAC/token) to an impersonating endpoint.

# Key outcomes
outcomes:
  - 'Every `ServerCertVerifier`/`ClientCertVerifier` in `crates/` verifies TLS 1.2 and 1.3 handshake signatures through the rustls crypto provider (`rustls::crypto::verify_tls12_signature` / `verify_tls13_signature` with the provider''s `signature_verification_algorithms`); no `HandshakeSignatureValid::assertion()` remains in `crates/` — evidence: two verifiers exist (`TofuVerifier`, `ProbeVerifier`, both in tofu.rs), no `ClientCertVerifier`; 4 verify calls, 0 `assertion()` left'
  - '`supported_verify_schemes` returns the provider''s supported schemes, not a hand-written list — `t3629_verify_schemes_come_from_provider`'
  - 'Regression test: a normal TOFU handshake against a loopback test server still succeeds — `t3629_tofu_handshake_with_matching_key_succeeds` (TLS 1.2 + 1.3), `t3629_probe_with_matching_key_returns_fingerprint`'
  - 'Regression test: a server presenting a PINNED certificate but signing with a different private key fails the handshake; shown failing (i.e. handshake accepted) on the old code — `t3629_pinned_cert_signed_with_other_key_is_rejected` + `t3629_probe_rejects_cert_signed_with_other_key`: with the old `assertion()` bodies restored both FAILED (rc 101, 3 passed / 2 failed); with the fix all 5 pass'
  - '`cargo test -p termlink-session`, `cargo test -p termlink --bin termlink` and the hub crate''s tests pass — session 584 passed, hub 560 passed, CLI 1259 passed, 0 failed'
  - 'A debug build still connects to a live hub (`remote ping` + `hub status`) — PONG from local-hub (127.0.0.1:9100), ring20-management (.122), ring20-dashboard (.121); `hub status` running'

