# Decisions (task file Decisions section, joined with decisions.yaml by task id — T-4193)
decisions:
  - decision: '2026-10-28 — Q7: is governance and operations machinery part of TermLink? D′ two layers (operator ruling)'
    chose: 'D′. The repo holds two layers, as AEF holds the framework plus a vendored instance of itself: (1a) TermLink the product, which is what a release ships (`cargo build -p termlink`, release.yml:169; plus install script and Homebrew formula); (1b) the TermLink development project, run as an AEF consumer (tasks, runme.sh, the 98 check-*.sh guards, 46 cron files, review ledgers, and the operation of our own fleet). Governance machinery is part of 1b, not of the product, and rightly lives in this repo. Concretely: 6a AEF''s chores leave runme.sh for AEF''s `fw runme` (actions 11, 11b, 11c, 13, 16) and ring20''s for ring20 (action 22); 6b governance guards stay as dev-project tooling, generic ones offered upstream only where AEF lacks them; 6c a cap on dev-project canaries (one in, one out); 6d label the layers: objectives and value drivers split into product and project sets, README/charter say which layer they describe, external briefs say "the product is crates/ and the release; the rest is how we build it".'
    rationale: 'operator, 2026-10-28: "differentiate between the TermLink development project … and the TermLink application … just as AEF does it, we also eat our own dog food". The round-1 reviewers read the repo as one thing and counted dev-project guards as product surface; objectives.yaml and policy/value-drivers.yaml mix both layers, so D1 scores a new dev-project canary as product progress.'
    alternatives_rejected: ['A move everything out (takes product-proving canaries away from their code, cross-repo cron migration risk); B cap only (leaves AEF chores going stale here); C lower D1 only (moves nothing); D as first briefed (treated governance guards as misplaced, which the two-layer view dissolves). - **Left open:** the cap''s number (6c) and D1''s weight (option C) fold into round 4''s driver work; running our own fleet is counted as 1b, and the ring20-side part moves to ring20 if they come to own their hosts. Round 4 writes the single purpose, objectives and drivers for 1a, plus a short separate 1b set.']
  - decision: '2026-10-28 — round 4: draft now, operator reads first, then outside review (operator ruling C)'
    chose: 'C. Draft from Q1–Q7, operator reads and corrects it, then at most 2 rounds of outside review by the subscription seats (claude, codex, antigravity, opencode). Q6 stays marked open (pending T-3615 data). Draft v0.1: docs/reports/T-3612-round4-draft.md.'
    rationale: 'the operator''s answers are the draft''s substance; review then tests a draft the operator stands behind.'
    alternatives_rejected: ['A (review before the operator reads: may spend a round on wording the operator rejects); B (wait for telemetry: weeks on a known-wrong yardstick); D (stop: leaves the mixed-layer yardstick, against Q7).']
  - decision: '2026-10-28 — the purpose sentence: E (operator ruling)'
    chose: 'E. "TermLink makes sure every message reaches the recipient it is meant for: it finds that recipient, wakes it in its terminal when it must, hands the message over, and shows where it is until an agent that can act has it, or it is loudly stuck." Scope sentence after it: "It is the base layer: it records work handed off between agents, and leaves what work to do, and who should do it, to the framework above."'
    rationale: 'operator: the essence is reaching the recipient, and more than brokerage: the recipient is found, addressed and activated. Handed-off work is message content, so naming it in the sentence reads as orchestration. "Meant for" means the addressed recipient or role holder, never the best one for the job. "Or loudly stuck" answers the reviewers: TermLink cannot force an agent to act, but makes every stop visible.'
    alternatives_rejected: ['A, A-short, B, C, D (dialogue log item 15; review synthesis C.14). - **Left open:** adoption of the whole draft (charter, its guard and copies change only then).']

