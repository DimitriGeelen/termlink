# Key outcomes
outcomes:
  - '`.agentic-framework/agents/context/revisit-due-scan.sh` exists, is executable, and runs without arguments'
  - 'Scanner reads `.tasks/active/*.md`, extracts `revisit_at:` frontmatter values, and selects entries where the date is `<= today` (UTC, lexicographic compare on ISO `YYYY-MM-DD` is correct)'
  - 'Output written atomically to `.context/working/.revisits-due.txt`, one line per ripe task in the form `T-XXX fires YYYY-MM-DD: <name>` (matches existing manual file format for downstream-reader compat)'
  - 'When no tasks are ripe, the output file is removed (absent) — downstream readers treat absent + empty as "nothing to surface"'
  - 'Unit test `.agentic-framework/agents/context/tests/revisit-due-scan-test.sh` creates 4 mock tasks (ripe, future, no-field, commented-hint), runs scanner against tmpdir, asserts only ripe appears + asserts file is removed when nothing is ripe'
  - 'Cron registry entry added to `.context/cron-registry.yaml` (revisit-due-scan job, daily 07:00) — cron-registry.yaml is the canonical source per T-448'
  - '`fw cron install` produces `/etc/cron.d/agentic-audit-termlink` containing the new line (verified live)'
  - '`.agentic-framework/agents/handover/handover.sh` reads `.context/working/.revisits-due.txt` and emits a "## Revisits Ripe Today" section iff the file is non-empty; smoke-tested with synthetic line'
  - 'Channel-1 mirror: scanner + handover.sh edit + test pushed upstream at commit `76d53e29` on master (rebased onto aaf7f69b). Cron-registry stays local — it''s consumer-side opt-in.'

