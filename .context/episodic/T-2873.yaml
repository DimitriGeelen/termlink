# Key outcomes
outcomes:
  - '**The MCP tool sends a valid `KeyEntry` payload.** Construction extracted to `build_inject_keys(text, enter)` and fixed to emit `[{"type":"text","value":<text>}]` plus `{"type":"key","value":"Enter"}`. One Text entry for the whole string, matching the CLI sibling. Extracted rather than fixed in place because the old construction was inline in an async fn that needs a live hub to reach, which is exactly why no test could see it.'
  - '**The wire shape is proven, and proven able to fail.** Three tests decode the built array against the REAL `KeyEntry` type from `termlink-protocol`, not a hand-written JSON shape — a shape assertion would pass just as happily against the bare strings that caused the outage, since both are valid JSON (the PL-148 tautology). Load-bearing: restoring the exact pre-fix construction fails both positive tests (`MUTANT_RC=101`); restoring the fix returns green. A third test pins the regression directly — bare `["p"]` must NOT decode as `KeyEntry`; if it ever does, this diagnosis was wrong.'
  - '**The version-skew hypothesis is disproved, with evidence.** `fleet doctor` puts .122 at `0.11.1411`, not `0.9.0`; the `0.9.0` reading came from session metadata, which is the T-2744 defect (`termlink-session` stamped the Cargo.toml constant into every session ever created, while the same binary reported `0.11.720` from `--version`). The failure reproduced **byte-identically against the local `0.11.1716` hub** — the newest binary in the fleet — so no hub version is implicated. Control on the same hub and same session: the CLI path injected 20 bytes successfully while the MCP path failed.'
  - '**The parity census reason is corrected rather than cleared.** `termlink_remote_inject` stays in `.context/checks/mcp-parity-census-allowlist` because no `parity.rs` assertion exists yet and deleting the line would make the census claim coverage it does not have (T-2680). Its reason now records that the tool is no longer *unexamined* — it was examined and was broken — and that a full MCP-vs-CLI case is still owed under T-2748. Census re-runs clean: 260 tools, 24 asserted, 236 acknowledged, 0 unexamined.'
  - '**End-to-end through the MCP server.** PROVEN 2026-09-01, and proven on the RECEIVER rather than the sender. The blocker was never the fix — it was that the MCP server attached to this session is a long-lived process still running pre-fix code, which cannot be restarted from inside the session it serves. That does not require a restart to verify: a **fresh `termlink mcp serve` was spawned from the rebuilt binary** (`/root/.cargo/bin/termlink`, mtime 13:38, postdating the fix commit `93cb3d8d9` at 12:55) and driven over stdio with a real MCP handshake — `initialize` → `notifications/initialized` → `tools/call termlink_remote_inject`. Two runs: against a non-PTY tmux session the call returned `ok:false` with `"No PTY session"` — note the `-32602 Invalid keys format` is **gone**, so the `KeyEntry` payload now deserializes and reaches session resolution; against a PTY-backed session (`spawn --shell --backend background`) it returned `{"ok": true, "result": {"status": "injected", "bytes_len": 21}}`. **The hub saying `injected` is not proof** — that is this task''s own finding — so `termlink output t2873pty` was read and shows `echo T2873_INJECT_OK` echoed and its output `T2873_INJECT_OK` on the following line. The command was injected AND executed. Server identified itself as `termlink-mcp 0.11.1766`.'
  - '[REVIEWER] Restart the MCP server so the fixed `termlink_remote_inject` goes live.'

