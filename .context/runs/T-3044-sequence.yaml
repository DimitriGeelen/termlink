sovereign_question:
  id: SQ-3044-1
  question: >
    The instruction asks for 2 autonomous rounds, but both prompts contain hard human
    gates: value-review PHASE 1 "[ASK] ... Do not continue until both are confirmed",
    PHASE 5 "[ASK] Human approves / rejects / modifies per item", and PHASE 6 "EXECUTE
    APPROVED ITEMS ONLY". procAsFit independently says "Sovereign questions are
    surfaced, not resolved". A fully unattended 2-round loop can only be achieved by
    driving through those gates, which both prompts forbid.
  orchestrator_position: >
    Not resolved by the orchestrator. Workers are configured to run to the PHASE 1 [ASK]
    and halt, producing the yardstick + data availability map for confirmation. Round 2
    cannot be meaningfully defined until Round 1 Phase 5 is approved, since its input is
    "the result of the previous round".
  options:
    - A: confirm yardstick + data map now; workers continue to a Phase 5 report and halt
         there for item-by-item approval (preserves every gate; 2 human touchpoints/round)
    - B: pre-authorise Phases 0-5 only (research is read-only), keeping Phase 6 execution
         human-gated. Rounds chain on reports, never on unapproved execution.
    - C: state explicitly that the [ASK] gates are waived for this run (a Tier-2
         situational authorization, logged) — orchestrator will not assume this.
