- id: IF-4
  finding: "The on-disk mandate differed from the operator's pasted text in one substantive place: stop\
    \ condition \"~300k\" vs \"~800k\". Both are wrong (T-3192). 300k is budget-gate.sh's DEFAULT WINDOW\
    \ SIZE quoted as a budget \u2014 37% of this project's 800000 window, below even the first warning,\
    \ so a run stops before working. 800k IS the window, so it cannot fire before TOKEN_CRITICAL (760000)\
    \ hard-blocks the worker mid-task, which the mandate's own \"do not stop mid-task\" clause forbids.\n"
  fix: 'Prompt now names TOKEN_WARN and instructs the worker to read the live value. The operator''s text
    was not silently rewritten; the reasoning is quoted inline.

    '
