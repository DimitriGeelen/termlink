- error: Declared R2 attempt 1 failed from a mid-round skeleton snapshot.
  reality: 'It was ALIVE and still working. Commit 1f3932735: "was alive, not crashed". It later wrote
    a full 12086-byte handback with 0 placeholders.'
  consequence: I launched attempt 2 concurrently, violating the mandate's own serialization. The workers
    handled the collision better than I did - attempt 1 detected it and yielded cleanly.
  lesson: Carried fix 3 tells workers to write the skeleton FIRST, so a skeleton is the expected artefact
    of a round IN PROGRESS. A placeholder check is correct but must be applied when the worker is gone,
    not on a snapshot.
- error: Reported "no worker ran at all" when a harness shell was killed before dispatch returned.
  reality: A worker had spawned and went on to close T-3127 (c54b48002). I checked seconds after the kill.
  lesson: 'Same class: measuring a running process by a snapshot and calling it dead. Twice in one hour,
    by the orchestrator, in a session about exactly this.'
- error: Reported R1 as clean because its Sovereign-questions section read "_(none yet)_".
  reality: 'That is the skeleton placeholder. R1 still shows 2 placeholders and Status: IN PROGRESS. It
    had surfaced a real finding (SQ-4) in its body and never landed it in the section.'
- error: Orchestrator (PID 2438768) died when its dispatch collect-window expired at 1829s (~30min),
    while its R3 worker (PID 2438794) ran on for another 52 minutes and completed normally.
  reality: 'The R3 dispatch log reads ok:false / events_collected:0 / timed_out:false - which reads as
    a failed round. It was not. The worker was orphaned, not dead, and went on to close T-3213 and T-3215.
    The 3600s PROCASFIT_ROUND_TIMEOUT lived in the dead parent, so nothing bounded the orphan either.

    '
  consequence: Rounds 4-9 had no launcher. Six of nine rounds would have silently never run, with the
    run record still reading R3 in-progress - the next session would have rediscovered this from scratch.
  lesson: 'Same class as the two errors above, a third time: a dispatch return code is not evidence about
    the worker. The script header already says this about handbacks; it is equally true of the parent''s
    own exit. Verify a round by reading its handback AND by checking whether anything is still scheduled
    to launch the next one.'
