# T-3211 — procAsFit x9 over TermLink, each round fed the previous handback.
#
# Carried on disk so state survives a context reset (the mandate's own TermLink clause).
# Every round's entry records what was VERIFIED independently, not what the handback
# claimed. A handback is a worker's account of its own work; the verified_by_orchestrator
# field is what was checked against git and the task register.
run: T-3211
prompt: docs/prompts/proc-as-fit.md
rounds_requested: 9
serialized: true          # one worker at a time; no sibling rounds share state

instrument_findings:
  - id: IF-1
    finding: >
      claude -p --dangerously-skip-permissions REFUSES under root ("cannot be used with
      root/sudo privileges for security reasons", exit 1, no output) while the worker
      still REGISTERS with the dispatcher. The envelope reads workers_spawned:1 /
      workers_registered:1 — indistinguishable from a worker that ran and had nothing to
      say. Nine rounds of that would have been nine fabricated handbacks.
    fix: IS_SANDBOX=1, probed directly (rc 0, file written) then end-to-end via dispatch.
    collateral: scripts/dispatch-t909-risk-eval.sh omits it and cannot work on this host.
  - id: IF-2
    finding: >
      The dispatcher's return code is not evidence in EITHER direction. The verified
      end-to-end probe returned rc=1 while the worker had written its file.
    consequence: Handbacks are verified by READING them (T-2876), never by rc.
  - id: IF-3
    finding: >
      T-3181's reported shape (ok:true with workers_registered:0) did NOT reproduce with
      correct flag syntax — measured workers_registered:1. An earlier probe of mine used a
      wrong flag form and its "side effect absent" was my error, not the tool's.
    consequence: T-3181 is not settled on my say-so; recorded for its owner.
  - id: IF-4
    finding: >
      The on-disk mandate differed from the operator's pasted text in one substantive
      place: stop condition "~300k" vs "~800k". Both are wrong (T-3192). 300k is
      budget-gate.sh's DEFAULT WINDOW SIZE quoted as a budget — 37% of this project's
      800000 window, below even the first warning, so a run stops before working. 800k IS
      the window, so it cannot fire before TOKEN_CRITICAL (760000) hard-blocks the worker
      mid-task, which the mandate's own "do not stop mid-task" clause forbids.
    fix: >
      Prompt now names TOKEN_WARN and instructs the worker to read the live value. The
      operator's text was not silently rewritten; the reasoning is quoted inline.

carried_fixes:
  - 'NON-INTERACTIVE WORKER: never background a long command and end your turn. A claude -p
    worker''s turn end IS its process end. T-3089 R4-attempt-1 did exactly that, exited 0,
    reported complete, and no deliverable was ever written.'
  - 'AT-THE-MOMENT RE-READ: before any shared/live-infra action, re-read the run record AND
    git log right then. T-3089 R3 restarted the shared hub 82s after the operator ruled to
    defer it, because its information was stale, not absent.'
  - 'WRITE THE HANDBACK EARLY as a skeleton and fill it as you go. A handback written only
    at the end is a handback you may never write.'
  - 'BUDGET READ: .context/working/.budget-status is shared across dispatched workers
    (T-3127); read your own via checkpoint.sh status.'

rounds:
  - round: 1
    dispatched_utc: '2026-09-28T23:07:00Z'
    handback: .context/runs/T-3211-R1-handback.md
    handback_bytes: 9598
    harness_outcome: >
      The background harness SHELL was killed by the host's low-memory guard while
      waiting. The WORKER was unaffected and had already written its handback — the two
      are independent by design, which is why a killed harness does not lose a round.
    selection:
      objective: charter verb 2, exchange durable messages (arc-010 headline mechanic)
      arc: arc-010 / slug arc-011 — in flight, not blocked, all 8 SQs resolved
      task: T-3135 sidecar API — the arc's only active task (S1 + S12, its unbuilt half)
      quadrant: Q2 (BVP 57 / cost 4.4 proposed). No Q1 in-arc; Q1 exhausted by absence.
      rationale: >
        Next candidates (T-3132, T-2203, T-2644) are Q1 but OUTSIDE the arc; level-2
        gating says stay in the in-flight arc while it has Q1/Q2 work.
    verified_by_orchestrator:
      - 'commit 244d7d03f exists with matching subject (task move)'
      - 'commit bcc8905bb exists with matching subject (the deliverable)'
      - 'T-3135 present in .tasks/completed/'
      - 'tests/notify-sidecar-api-fixtures.sh exists, 14237 bytes'
    worker_recorded_checks: 15      # traceability ledger in the handback
    gates_that_refused:
      - 'G-020 blocked a Bash READ whose grep pattern contained ">" (write-detector false
         positive). Gate premise was correct (unscoped build task); worker wrote real ACs
         rather than routing around, then re-ran without ">".'
      - 'fw work-on warned 76 other tasks in started-work — fleet hygiene, not in scope.'
    sovereign_questions: []
  - round: 2
    dispatched_utc: '2026-09-28T23:20:00Z'
    handback: .context/runs/T-3211-R2-handback.md
    status: in-flight

host_conditions:
  note: >
    ~50 claude processes and load ~12 are this host's STEADY STATE (T-3090 measured ~450
    agent processes under normal load, and the operator ruled the contended figure is the
    answer). Memory at round 2 dispatch: 62G total, 31G available. The low-memory kill hit
    the waiting harness shell, not the worker.
