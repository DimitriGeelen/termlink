# arc-008 design role chain — v2 (T-2204, after the T-2200 external review).
# One task per role, run in order; a step starts only when the step before it is approved.
# Driver: scripts/role-chain.py status|next|brief docs/designs/agent-authorization-broker/role-chain.yaml
# Gate today (T-2213 slice 1): a green independent agent review ("[REVIEW] Independent review: step N", ticked only
# by `fw reviewer verdict apply`) AND, where `decides: true`, the operator's "[REVIEW] Step N output approved" tick.
# Completion alone is never approval (T-2201).
# Gate planned (inception T-2206): each role runs as its own TermLink session; its output is reviewed under the
# framework's review policy (D-626 + IW-7); a positive verdict bound to the output hash hands over to the next
# role; operator-only for steps that decide (marked `decides: true`) and on escalation.
#
# Every role session receives, in this order: rules (harness-neutral project rules), common (rules for every
# role card), its card (portable: no harness, vendor, tool, path or language), adapter (how the framework does
# it), profile (this estate). Upstream originals (1000-AI-Roles @ d7e6d8a35b90) are provenance only:
# roles/upstream/, never part of an executed prompt.
# Each output is a top-level docs/designs/*.md so it is reviewable inline on the design-review page.
version: 2
chain: arc-008-design
arc: arc-008
plan: docs/designs/agent-authorization-broker-roles-plan.md
design: docs/designs/agent-authorization-broker.md
rules: policy/agent-rules.md
common: docs/designs/agent-authorization-broker/roles/cards/_common.md
adapter: docs/designs/agent-authorization-broker/roles/adapters/aef.md
profile: docs/designs/agent-authorization-broker/roles/profiles/ring20.md
steps:
  - step: 1
    role: Requirements collector
    task: T-2192
    prompt: docs/designs/agent-authorization-broker/roles/cards/requirements-collector.md
    inputs: [docs/designs/agent-authorization-broker.md, docs/designs/agent-authorization-broker-roles-plan.md]
    output: docs/designs/agent-authorization-broker-01-requirements.md
    settles: [T-2169]
    decides: true
    operator: interview, the 22 numbered questions (roles plan section 6), one at a time; signs the requirements off
  - step: 2
    role: Threat modeler
    task: T-2207
    prompt: docs/designs/agent-authorization-broker/roles/cards/threat-modeler.md
    inputs: [docs/designs/agent-authorization-broker-01-requirements.md]
    output: docs/designs/agent-authorization-broker-02-threat-model.md
    settles: [T-2168]
    decides: true
    operator: accepts or rejects the residual risks
  - step: 3
    role: Security floor and phasing
    task: T-2193
    prompt: docs/designs/agent-authorization-broker/roles/cards/mvp-specialist.md
    inputs: [docs/designs/agent-authorization-broker-01-requirements.md, docs/designs/agent-authorization-broker-02-threat-model.md]
    output: docs/designs/agent-authorization-broker-03-floor-and-phasing.md
    settles: [T-2178]
    decides: true
    operator: confirms the security floor and the phasing
  - step: 4
    role: Architect
    task: T-2194
    prompt: docs/designs/agent-authorization-broker/roles/cards/architect.md
    inputs: [docs/designs/agent-authorization-broker-01-requirements.md, docs/designs/agent-authorization-broker-02-threat-model.md, docs/designs/agent-authorization-broker-03-floor-and-phasing.md]
    output: docs/designs/agent-authorization-broker-04-architecture.md
    settles: [T-2170, T-2171, T-2172, T-2173, T-2174, T-2175, T-2176, T-2177]
    decides: true
    operator: decides the decision records (D-1 placement, D-2 root on agent hosts, and new ones)
  - step: 5
    role: Evidence specialist
    task: T-2196
    prompt: docs/designs/agent-authorization-broker/roles/cards/evidence-specialist.md
    inputs: [docs/designs/agent-authorization-broker-01-requirements.md, docs/designs/agent-authorization-broker-02-threat-model.md, docs/designs/agent-authorization-broker-03-floor-and-phasing.md, docs/designs/agent-authorization-broker-04-architecture.md]
    output: docs/designs/agent-authorization-broker-05-evidence.md
    settles: []
    decides: false
    iterates_with: 6
    operator: none; reviewed under the framework policy
  - step: 6
    role: Pseudo-coder
    task: T-2195
    prompt: docs/designs/agent-authorization-broker/roles/cards/pseudo-coder.md
    inputs: [docs/designs/agent-authorization-broker-01-requirements.md, docs/designs/agent-authorization-broker-02-threat-model.md, docs/designs/agent-authorization-broker-04-architecture.md, docs/designs/agent-authorization-broker-05-evidence.md]
    output: docs/designs/agent-authorization-broker-06-pseudo-code.md
    settles: []
    decides: false
    iterates_with: 5
    operator: none; reviewed under the framework policy (mandatory, the algorithms are the control)
  - step: 7
    role: Review panel and disposition
    task: T-2197
    prompt: docs/designs/agent-authorization-broker/roles/cards/review-panel.md
    inputs: [docs/designs/agent-authorization-broker-01-requirements.md, docs/designs/agent-authorization-broker-02-threat-model.md, docs/designs/agent-authorization-broker-03-floor-and-phasing.md, docs/designs/agent-authorization-broker-04-architecture.md, docs/designs/agent-authorization-broker-05-evidence.md, docs/designs/agent-authorization-broker-06-pseudo-code.md]
    output: docs/designs/agent-authorization-broker-07-panel-review.md
    settles: []
    decides: true
    operator: explicit go before anything leaves the estate; decides rejected and deferred security findings
  - step: 8
    role: Planner
    task: T-2198
    prompt: docs/designs/agent-authorization-broker/roles/cards/planner.md
    inputs: [docs/designs/agent-authorization-broker-01-requirements.md, docs/designs/agent-authorization-broker-02-threat-model.md, docs/designs/agent-authorization-broker-03-floor-and-phasing.md, docs/designs/agent-authorization-broker-04-architecture.md, docs/designs/agent-authorization-broker-05-evidence.md, docs/designs/agent-authorization-broker-06-pseudo-code.md, docs/designs/agent-authorization-broker-07-panel-review.md]
    output: docs/designs/agent-authorization-broker-08-build-plan.md
    settles: [T-2179]
    decides: true
    operator: signs off design v1.0, decides T-2164 and T-2166 against it, approves the plan before any task is created
