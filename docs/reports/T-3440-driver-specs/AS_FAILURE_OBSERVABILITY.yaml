# T-3440 5c (operator ruling A′) — draft scoring spec for arc-substrate-fitness
# driver AS_FAILURE_OBSERVABILITY (weight 5, human-approved 2026-06-22).
# Meaning: a failure in the substrate leaves a durable, readable trace instead of
# vanishing (dead-letter, canaries, queue/breaker logs, telemetry rollup).
kind: signals
strip_template: true
levels:
  1:
    keywords: ["silent", "poison", "observab"]
  3:
    keywords: ["dead-letter", "dead_letter", "dead letter", "canary", "queue-status", "breaker"]
    paths: ["scripts/check-*-freshness.sh", "crates/termlink-session/src/offline_queue.rs"]
  5:
    keywords: ["telemetry", "rollup", "queue.log", "fleet view"]
    paths: ["crates/termlink-hub/src/circuit_breaker.rs"]
