[package]
name = "termlink-sidecar"
description = "arc-011 PH-1 sidecar: estate guard (C-1) and disposable-estate test kit (C-12)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
termlink-session = { path = "../termlink-session" }
libc = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
termlink-protocol = { workspace = true }
ed25519-dalek = "2"
tokio = { workspace = true }
base64 = { workspace = true }
# T-3696 (B-11): per-agent X25519 encryption keys and the TLBLOB wrapper (06a AL-25/AL-26).
crypto_box = { version = "0.9", features = ["seal", "chacha20"] }
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }

[features]
failpoints = []

# T-3405: test builds always enable `failpoints`, so a plain `cargo test` (CI, `cargo test --workspace`)
# runs the store tests instead of compiling them away. Release builds do not get the feature.
[dev-dependencies]
termlink-sidecar = { path = ".", features = ["failpoints"] }
