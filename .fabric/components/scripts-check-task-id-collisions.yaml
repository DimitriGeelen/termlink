purpose: >-
  Deploy-time cross-branch check (T-2800). Axis A fires on a task ID claimed by more than one branch for different tasks; axis B warns on near-duplicate task titles across branches, scored on shared rare terms. Exists because T-229 renumbered colliding IDs in March 2026, routed the counter fix upstream as G-007, and nothing landed - by August twelve IDs collided and three agents had duplicated the same two fixes.

