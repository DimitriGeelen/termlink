  prover that only ever goes green is not a prover. Runs with no live session and
  no network via the SESSION_MSG_TEST_AGENTS_JSON and
  SESSION_MSG_TEST_TRANSCRIPT_DIR seams (PL-213), so it is a guard-layer member
  even though the script it tests is not.

