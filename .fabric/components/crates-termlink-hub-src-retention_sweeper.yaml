tags: [hub, retention, sweep, T-2427, T-1991]

purpose: >-
  Opt-in in-process periodic retention sweep for the hub (T-2427). The bus runs no background sweep thread by design (T-1155: enforcement is explicit, never implicit), which pushed enforcement onto per-host operator crons - empirically the least reliable part of the estate (T-1991 recurred on .121 because the cron was never installed). Gated on TERMLINK_SWEEP_INTERVAL_SECS.

