purpose: Deploy-time check (T-2801) for the pickup auto-deferred queue. Fires on STRANDED (no .breadcrumb.yaml sibling, so
  fw pickup promote-deferred can never evaluate it) and STALE (breadcrumbed but deferred beyond the threshold). Exists because
  P-043, a two-bug framework report, sat stranded for 73 days while one of its bugs was independently re-discovered and re-fixed
  as T-2304. Ages envelopes by recorded timestamp, never mtime.
