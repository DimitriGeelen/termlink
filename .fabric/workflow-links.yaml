# Component fabric ↔ workflow designer join.
#
# THE PROBLEM THIS SOLVES. We have two ID spaces that describe the same system and
# do not know about each other:
#
#   workflow designer   a node carries <aef:uid value="dl_spawn"/> — stable across
#                       saves, present on every node, and (per 832's round-trip
#                       census) survives open→save byte-for-byte.
#   component fabric    a card's `id:` IS its repo-relative path, e.g.
#                       crates/termlink-cli/src/commands/execution.rs, with typed
#                       depends_on / depended_by edges to other paths.
#
# Measured 2026-08-26: 393 fabric cards, 8 designer workflows, and ZERO references
# between them in either direction. Opening a process step tells you nothing about
# the code that implements it, and opening a card tells you nothing about which
# step it serves.
#
# WHY A SIDECAR AND NOT A NEW aef: ATTRIBUTE. The obvious move is
# `<aef:meta components="..."/>`. That would be a CONSUMER INVENTING VOCABULARY in
# a contract owned by 999-AEF and implemented by 832's designer — the exact drift
# 001-CashWeb declined to cause on the third-axis question (chat-arc 533), for the
# exact reason they gave: "a consumer inventing vocabulary and then asking you to
# ratify it is how a contract drifts." A ratified `components=` key would be
# strictly better than this file and we would adopt it the day it exists. Until
# then the join lives on our side of the boundary, where being wrong costs only us.
#
# THE JOIN KEY IS aef:uid, NOT THE BPMN element id. Element ids (agt_2_create) are
# editor-assigned and change; aef:uid (tl_create) is the stable identity the
# vocabulary exists to provide. Keying on the wrong one is a rename away from a
# silently empty join.
#
# EDGE TYPES answer four different operator questions, and collapsing them into one
# "related" list would lose the distinction that makes the link useful:
#
#   implements   the code this step IS. Open it to read what actually runs.
#   tested_by    the test that proves this step. Open it to see what is guaranteed.
#   probed_by    an API/testbench tool that exercises this step against a live
#                system — reserved and currently empty everywhere, because we have
#                not written them yet. Declared now so the schema does not need to
#                change when we do.
#   pseudocode   prose the step means but no file states. Inline, because it has no
#                path to point at.
#
# COVERAGE IS DELIBERATELY PARTIAL AND THE TOOL SAYS SO. Only links verified against
# a real card are recorded. scripts/fabric-workflow-link.sh reports UNLINKED nodes
# explicitly rather than listing what happens to be joined — a resolver that showed
# only its hits would assert coverage it does not have (the T-3105 doctrine the
# framework already applies elsewhere).

schema_version: 1

links:
  # ── aef-dispatch-loop ────────────────────────────────────────────────────────
  # The one workflow of the eight whose steps touch OUR code rather than the
  # framework's. The other seven (task lifecycle, session lifecycle, inception,
  # tier0, onboarding, audit-cron) describe vendored .agentic-framework/ behaviour
  # for which no fabric cards exist — cards cover scripts/ (174), crates/ (122),
  # tests/ (79), agents/ (6). That mismatch is why the join is empty today, and it
  # is a finding, not a gap in this file.

  - workflow: aef-dispatch-loop
    uid: dl_spawn
    node_name: "spawn isolated worker — fw termlink dispatch (task-tagged, kill watchdog)"
    implements:
      - crates/termlink-cli/src/commands/execution.rs
      - agents/mesh/dispatch.sh
    tested_by: []
    probed_by: []
    pseudocode: |
      Spawn a worker session and report whether it registered.
      T-2550: the default (non---wait) path emits registered:"unconfirmed" plus a
      note; --wait polls find_session and emits registered:"confirmed", ready:true.
      ready:false is deliberately NOT emitted on the unchecked path — that path does
      not know the session is unready, only that nobody looked.

  - workflow: aef-dispatch-loop
    uid: dl_retry
    node_name: "re-dispatch retry envelope — linked via retry_of_dispatch_id"
    implements:
      - agents/mesh/dispatch.sh
    tested_by: []
    probed_by: []
    pseudocode: |
      Re-dispatch carries retry_of_dispatch_id so the retry and its original join in
      the outcome table. Without the link a retry reads as an independent dispatch
      and the failure rate is understated.

  # ── aef-task-lifecycle ───────────────────────────────────────────────────────
  # The workflow steps are framework behaviour, but two of them are policed by OUR
  # guards — the code that makes the step trustworthy is ours even though the step
  # itself is vendored. That is exactly the relation this join exists to express:
  # a step and the component that guarantees it need not live in the same repo.

  - workflow: aef-task-lifecycle
    uid: tl_verify
    node_name: "completion gates: Agent ACs (P-010) + ## Verification commands"
    implements: []
    tested_by:
      - scripts/check-verification-pipefail.sh
      - scripts/check-unpaired-capture.sh
      - scripts/check-vacuous-verification.sh
    probed_by: []
    pseudocode: |
      The gate runs each ## Verification line under `set -eo pipefail` as
      `if ( eval "$cmd" )`. Three of our guards police the QUALITY of those lines
      rather than the gate itself: pipefail/SIGPIPE shapes, capture-without-failure-
      assertion, and patterns that cannot go red. A green gate over a vacuous line
      is indistinguishable from a green gate over a real one.

  - workflow: aef-task-lifecycle
    uid: tl_human_review
    node_name: "partial-complete: review Human ACs (Watchtower /review)"
    implements: []
    tested_by:
      - scripts/check-approval-surfaces.sh
    probed_by: []
    pseudocode: |
      R-033: an agent can never close a human-owned task, and count_unchecked_human_acs
      returns 0 for a finished one — so it is gated on the operator and appears in no
      queue. check-approval-surfaces enumerates all three surfaces (build /review,
      inception /inception, owner-completion) and fires only when a pending action
      would open to a card nobody can act on.

  # ── aef-session-lifecycle ────────────────────────────────────────────────────
  - workflow: aef-session-lifecycle
    uid: sl_review
    node_name: "operator processes review queue — fw task review URL"
    implements: []
    tested_by:
      - scripts/check-approval-surfaces.sh
      - scripts/lib/approval_surfaces.py
    probed_by: []
    pseudocode: |
      The queue predicate is count_unchecked_human_acs (web/shared.py) — canonical for
      both /approvals and `fw review-queue`. It cannot express two states it needs to:
      an inception awaiting a go/no-go decision, and a human-owned task whose work is
      finished. Both are operator-gated and invisible to it.

  # ── aef-inception-flow ───────────────────────────────────────────────────────
  - workflow: aef-inception-flow
    uid: if_archive
    node_name: "archive: completed/ + episodic; on DEFER set revisit"
    implements: []
    tested_by:
      - scripts/lib/approval_surfaces.py
    probed_by: []
    pseudocode: |
      G-053/T-1451: revisit_at makes a DEFER a PAUSE rather than a silent drop.
      defer_state() reads FRONTMATTER ONLY and treats a DEFER as pending when its
      revisit is due, absent, or unparseable — never when it is legitimately parked.
      Reading the whole document instead cost T-2090 its documented no-calendar-trigger
      decision.

  # ── aef-audit-cron ───────────────────────────────────────────────────────────
  - workflow: aef-audit-cron
    uid: ac_triage
    node_name: "operator triages findings — Watchtower /audits, /approvals"
    implements: []
    tested_by:
      - scripts/check-approval-surfaces.sh
    probed_by: []
    pseudocode: |
      This step assumes the operator can SEE the findings. /approvals currently
      double-escapes Human AC markup (375 escaped <code> vs 2 real, measured
      2026-08-26; filed framework:pickup 55) and misses two whole categories of
      pending action. The triage step is only as good as the surface it reads.
