# (/find-idle, /claims, /queue-status, /governor, /be-reachable, /agent-handoff,
# /check-arc, the substrate-primitive catalogue).
#
# The framework DOES notice: after writing, it diffs against CLAUDE.md.bak and
# prints "N line(s) ... are absent from the new CLAUDE.md", then proceeds. That
# is observation, not prevention, and the operator must catch it inside a
# 10-step run before the next commit prunes the .bak. It has fired at least
# three times in this lineage (upstream PL-124 twice in a week, then here,
# losing an entire skills table). Filed upstream at framework:pickup offset 29;
# tracked locally as T-2015.
