# Local modifications to VENDORED framework code (.agentic-framework/).
#
# Why this file exists (T-2812)
# -----------------------------
# The framework is vendored, and `git log -- .agentic-framework/` shows a
# WHOLESALE vendor event roughly every two months — `fw upgrade`,
# `bootstrap-replace`, `fw update v1.6.7 -> v1.6.295 (444 files)`. Each one
# replaces the tree. Any local fix that upstream does not carry is deleted, in
# silence, by a routine maintenance operation.
#
# Until this file existed, "what have we changed locally, and did it land
# upstream?" could only be answered by reading 124 commit messages. It was found
# the hard way: T-2813 was about to be closed as complete with 12/12 fixtures
# green, and its fix — to vendored `lib/pickup.sh` — had no upstream filing and
# was one `fw update` from deletion. A re-vendor was being proposed on another
# branch at that moment (T-2705).
#
# Convention borrowed from peer project 832-Workflow-designer, which cites its
# own `.vendor-divergence.yaml` in cross-project filings.
#
# status values:
#   filed-upstream   — reported, not yet confirmed carried. Still at risk.
#   landed-upstream  — confirmed present upstream; the local copy is redundant
#                      and a re-vendor is safe for it.
#   local-only       — not filed. A re-vendor DELETES this.
#
# Check: bash scripts/check-vendor-divergence.sh

