# Local modifications to VENDORED framework code (.agentic-framework/).
#
# Why this file exists (T-2812)
# -----------------------------
# The framework is vendored, and `git log -- .agentic-framework/` shows a
# WHOLESALE vendor event roughly every two months — `fw upgrade`,
# `bootstrap-replace`, `fw update v1.6.7 -> v1.6.295 (444 files)`. Each one
# replaces the tree. Any local fix that upstream does not carry is deleted, in
# silence, by a routine maintenance operation.
#
# Until this file existed, "what have we changed locally, and did it land
# upstream?" could only be answered by reading 124 commit messages. It was found
# the hard way: T-2813 was about to be closed as complete with 12/12 fixtures
# green, and its fix — to vendored `lib/pickup.sh` — had no upstream filing and
# was one `fw update` from deletion. A re-vendor was being proposed on another
# branch at that moment (T-2705).
#
# Convention borrowed from peer project 832-Workflow-designer, which cites its
# own `.vendor-divergence.yaml` in cross-project filings.
#
# status values:
#   filed-upstream   — reported, not yet confirmed carried. Still at risk.
#   landed-upstream  — confirmed present upstream; the local copy is redundant
#                      and a re-vendor is safe for it.
#   local-only       — not filed. A re-vendor DELETES this.
#
# Check: bash scripts/check-vendor-divergence.sh

schema_version: 1
last_vendor_event:
  commit: 8c1cca561
  date: 2026-06-08
  description: "fw update v1.6.7 -> v1.6.295 (444 files)"
  # NOT promoted to the 2026-08-25 event below — see vendor_events[] for why the
  # baseline stays wide on purpose.
  note: >
    The baseline for "at risk". Commits touching .agentic-framework/ BEFORE this
    were either carried by the update or already lost; only later ones are
    pending destruction by the next event. Note that T-2469's message says
    "re-vendor recommended" — recommended, not performed — so it is NOT a vendor
    event, and treating it as one understates the window.

# READ THIS BEFORE RUNNING fw upgrade / fw update / any re-vendor.
#
# The registered divergences below are not the only thing a re-vendor destroys.
# `fw upgrade` step 1/10 rewrites CLAUDE.md, and the boundary is POSITIONAL:
#
#     current_governance=$(sed -n '/^## Core Principle$/,$ p' "$project_claude")
#     printf '%s\n%s\n' "$project_header" "$governance" > "$project_claude"
#
# Everything from `## Core Principle` to END OF FILE is replaced wholesale with
# the framework template. Everything above it survives. Nothing in CLAUDE.md
# marks that boundary.
#
# MEASURED 2026-08-20 on this repo: CLAUDE.md is 2493 lines, `## Core Principle`
# is at 1650, so **844 lines sit in the destroyed half** — including the entire
# Quick Reference table and its 29 project-specific operator entry points
# (/find-idle, /claims, /queue-status, /governor, /be-reachable, /agent-handoff,
# /check-arc, the substrate-primitive catalogue).
#
# The framework DOES notice: after writing, it diffs against CLAUDE.md.bak and
# prints "N line(s) ... are absent from the new CLAUDE.md", then proceeds. That
# is observation, not prevention, and the operator must catch it inside a
# 10-step run before the next commit prunes the .bak. It has fired at least
# three times in this lineage (upstream PL-124 twice in a week, then here,
# losing an entire skills table). Filed upstream at framework:pickup offset 29;
# tracked locally as T-2015.
#
# PRE-RE-VENDOR CHECKLIST
#   1. bash scripts/check-vendor-divergence.sh      # nothing unclassified
#   2. Confirm every `status: filed-upstream` below is now carried upstream,
#      or accept losing it.
#   3. cp CLAUDE.md CLAUDE.md.prevendor              # the 844 lines
#   4. Run the re-vendor.
#   5. diff CLAUDE.md.prevendor CLAUDE.md            # re-apply what was dropped
#   6. Re-check the modes listed under `mode-only` (PL-205 fail-open).
#   7. Update `last_vendor_event` here.

divergences:
  - task: T-2687
    also_task_ids: [T-2813, T-2839]
    restored: >
      DELETED by the 2026-08-26 re-vendor (9b47462c5) and restored the same day
      under T-2839, commit be0fcfa68 — which is why that task id appears here.
      This is not a second divergence: it is the SAME fix, re-applied after a
      vendor event removed it, exactly the transaction this register exists to
      make possible. The checker matches on the task id parsed from the commit
      subject, so without T-2839 listed the restoration reads as an
      unregistered local change — a recovery indistinguishable from a rogue
      patch, which is the wrong direction for a register whose job is telling
      those two apart.
    id_note: >
      ONE fix, TWO task ids — the T-2800 concurrent-allocation class. The work was
      tracked as T-2813 (this register's founding entry, and the narrative in the
      header above), but the commit that carries it is tagged T-2687, the id this
      branch was named for. The register's match key is the task id parsed from the
      COMMIT SUBJECT, so while this entry said `task: T-2813` the checker reported
      the commit as UNREGISTERED — a registered divergence reading as unregistered,
      which is the direction that costs an operator a duplicate entry rather than a
      silent miss. Corrected to the id the commit actually carries; T-2813 kept here
      so the header narrative still resolves.
    commit: ed60a64ea
    date: 2026-08-20
    file: .agentic-framework/lib/pickup.sh
    status: filed-upstream
    kind: fix
    generality: GENERIC
    symptom: >
      Two fail-open paths on the pickup ingest rail. pickup_dedup_hash emitted the
      CONSTANT digest sha256("||") when all three hash inputs extracted empty, so
      every unreadable envelope collided with every other and was treated as an
      already-seen duplicate. pickup_create_inception minted tasks with an empty
      name when payload.summary or source.project extracted empty.
    evidence: tests/pickup-failopen-fixtures.sh — 12 assertions, all refusal paths
    upstream_ref: "framework:pickup offset 27"

  - task: T-2304
    commit: 78a7a6de1
    date: 2026-07-02
    file: .agentic-framework/agents/task-create/update-task.sh
    status: landed-upstream
    landed_verified: >
      2026-08-26, mechanical audit of the whole register. Upstream carries the
      fix by a BETTER mechanism than the one we filed: we threaded FRAMEWORK_ROOT
      through the environment into a `python3 -` heredoc; upstream passes it as
      argv[3] and keeps the env var as fallback
      (`sys.argv[3] if len(sys.argv) > 3 else os.environ.get("FRAMEWORK_ROOT","")`).
      argv survives an env-stripping wrapper, ours did not. Verified by reading
      the invocation, not by counting FRAMEWORK_ROOT occurrences — that count
      went 36 -> 38 and would have been reassuring either way.
    kind: fix
    generality: GENERIC
    symptom: >
      inception-scope-trace runs python via heredoc, where __file__ is '<stdin>',
      so sys.path could not be derived and `import lib.inception_decisions`
      failed — breaking `fw inception decide` finalization. Fixed by passing
      FRAMEWORK_ROOT through the environment.
    note: >
      This defect has already cost the project twice. A pickup envelope (P-043,
      2026-06-08) reported it; the envelope was stranded unread for 73 days, and
      the bug was independently re-discovered and re-fixed as T-2304 in the
      interim. Losing it to a re-vendor would be the third time.
    upstream_ref: "framework:pickup offset 27"

  - task: T-2721
    commits: [4f9068496, 86e9db17e]
    date: 2026-08-15
    file: .agentic-framework/agents/audit/audit.sh
    status: landed-upstream
    kind: fix
    generality: GENERIC
    symptom: >
      Two commits, one file. 4f9068496 fixed four worktree-blind audit checks —
      hooks resolved via `git rev-parse` so they resolve in a linked worktree, and
      CTL-020 skips cleanly instead of reporting a false finding. 86e9db17e hoisted
      `_resolve_hook_path` to top level; defined section-locally it made CTL-011
      resolve to the empty string, so the check silently passed on nothing.
    evidence: >
      Load-bearing and observed live this session — the pre-push audit on this
      branch printed "Cron drift checks skipped — linked worktree (cron is
      host-level, managed from the main checkout)", which is exactly 4f9068496's
      behaviour. Without it the audit reports cron drift against a worktree that
      does not own the host's cron, and the T-2815 basename defect blocks the push.
    risk: >
      RESOLVED 2026-08-25. The re-verification this entry asked for has been done.
      `fw upgrade` re-vendored the tree and `_resolve_hook_path` went to zero
      occurrences — which looks like the deletion this entry feared, and is not.
      Upstream superseded the inline shell helper with dedicated modules,
      lib/hook_paths.py and lib/hook_portability.py (T-2468, generalizing
      T-2465/OBS-080, updated by T-2709). Those solve a strictly larger problem:
      they re-derive the project root from the per-call stdin `cwd` Claude Code
      supplies, which is fresh rather than inherited, so they are immune to the
      T-2446 daemon-poison class that limits CLAUDE_PROJECT_DIR trust.
    verified_by: >
      `fw doctor` on the re-vendored tree reports two checks that did not exist
      before: "Hook path validation: 27 hooks, all portable" and "Hook exercise
      from /tmp: 23 PreToolUse/PostToolUse hook(s) resolve from foreign CWD".
      The second is the worktree symptom this divergence existed for, now covered
      by an upstream test rather than by a local patch.
    lesson: >
      Marker-count deltas are not evidence of loss. A divergence disappearing from
      the tree has two causes that look identical to grep — deleted by re-vendor,
      or superseded by a better upstream fix — and only reading the replacement
      tells them apart. This is the same NONE-vs-NOT-LOOKED-AT class as the
      corpus_*.py "never vendored" error (see not_divergence/recovery, T-2819).
    upstream_ref: "framework:pickup offsets 35 (hook paths, T-2714) and 36 (CTL-020, T-2715)"

  - task: T-2469
    commit: a46e8e726
    date: 2026-07-31
    file: .agentic-framework/agents/context/budget-gate.sh
    status: landed-upstream
    landed_verified: >
      2026-08-26, mechanical audit of the whole register. Absorbed by upstream's
      own T-2702, which reached the same deadlock independently and documents it
      at budget-gate.sh:155-158. The allowlist regex now permits
      `fw\s+(handover|context\s+focus)`, so the wrap-up path we unblocked by
      hotfix is open by design rather than by our patch. Verified by reading the
      regex, not by counting 'focus' mentions — that count went 1 -> 5.
    kind: fix
    generality: GENERIC
    symptom: >
      Wrap-up deadlock: budget-gate.sh's allowed-command list omitted
      'context focus', so at critical budget the agent could not set focus — and
      focus is required by the task gate for the very wrap-up actions the budget
      gate permits. On-disk hotfix applied; recorded as PL-265.
    upstream_ref: "framework:pickup offset 27"

# Deliberately NOT divergence. Recorded so the register does not grow to include
# everything that touches the vendored tree, which would make it as unreadable as
# the commit log it replaces.
not_divergence:
  - kind: vendor-event
    tasks: [T-2705]
    commit: c933f8eb7
    date: 2026-08-14
    reason: >
      A PERFORMED re-vendor to framework v1.6.145 — 1078 files, +97913/-1614
      under .agentic-framework/. Replacing the tree is the thing this register
      warns about, not an instance of it, so it is not local divergence.
    baseline_note: >
      DELIBERATELY NOT promoted to `last_vendor_event`. It is newer than the
      declared baseline (8c1cca561, 2026-06-08), so promoting it would shrink the
      at-risk window from 16 commits to 4 — and per the header, a baseline that
      quietly UNDERSTATES the window is the dangerous direction. This is also the
      commit whose own message says "(UNVERIFIED: budget gate blocked test/doctor/
      startup checks)", so it is not established that the tree it installed is
      sound. Promoting the baseline is a deliberate operator act; leaving the
      window too wide costs a few extra classifications, leaving it too narrow
      costs a silently deleted fix. Flagged for the human, not decided here.

  - kind: vendor-event
    tasks: [T-2015]
    commit: 9b47462c5
    date: 2026-08-25
    reason: >
      A PERFORMED and VERIFIED re-vendor — 676 files under .agentic-framework/,
      applied by `fw upgrade` and kept deliberately. Replacing the tree is the
      thing this register warns about, not an instance of local divergence.
    why_kept: >
      The incoming tree reads VERSION 1.6.29 against our 1.6.145, which looks
      like a downgrade and is not. VERSION is a resetting counter, so direction
      was decided by CONTENT: the incoming tree cites T-3110..T-3129, task ids
      absent from ours entirely and in flight upstream at the time. It is far
      newer. The previous session reverted this same tree on the version-string
      reading, discarding months of upstream work to protect one local patch
      that upstream had already fixed better — see the T-2714 entry under
      divergences, now landed-upstream.
    verified_CORRECTED_2026-08-26: >
      THIS ENTRY OVERSTATED WHAT WAS VERIFIED, AND THE OVERSTATEMENT COST A
      DIVERGENCE. I checked ONE marker (_resolve_hook_path, legitimately
      superseded upstream) and wrote the event up as safe. The same re-vendor
      ALSO deleted the entire T-2687 fail-open fix from lib/pickup.sh — all four
      guards across pickup_dedup_hash, pickup_create_inception,
      pickup_record_dedup and pickup_process_one. Status was `filed-upstream`,
      and filed is not carried.
      This register's own founding narrative predicted it verbatim: the T-2813
      fix "had no upstream filing and was one `fw update` from deletion".
      Caught 2026-08-26 by scripts/run-guard-layer.sh running
      tests/pickup-failopen-fixtures.sh (6 passed / 6 failed, reporting the
      constant sha256("||") digest by name). Restored surgically per function;
      fixtures now 12/12. The lesson is that a vendor event must be checked
      against EVERY registered divergence, mechanically — one marker is a spot
      check dressed as an audit.
    verified: >
      `fw doctor` green apart from a stray .deb; `fw corpus explain`, `fw gaps`
      and `fw review-queue` all exit 0; status-transitions.yaml validates for
      the first time ("8 transitions, no orphaned/unreachable states"), a check
      that could not run before the T-2819 allowlist fix. Consumer surfaces
      (.claude/commands/, scripts/) were restored from HEAD rather than kept —
      measured, not assumed: our agent-send.sh is 717 lines and carries every
      feature of the incoming 229-line template, with more of each.
    baseline_note: >
      DELIBERATELY NOT promoted to `last_vendor_event`, for the same reason
      c933f8eb7 was not: promoting shrinks the at-risk window, and per the
      header a baseline that understates the window is the dangerous direction.
      Promotion is an operator act.
    identity_note: >
      This event recorded version_sha 67aeacc735006f6aed489fce7af0ec9248587917
      into .framework.yaml (T-2713). That sha — not the VERSION string — is the
      only reliable identity of a vendored tree, and is what future comparisons
      should use.

  - kind: merge-of-upstream
    tasks: [T-2830]
    commit: a25afc4b6
    date: 2026-08-23
    reason: >
      The t2687 -> main pre-resolution merge. Its 951-file / +70552 footprint under
      .agentic-framework/ is origin/main's vendored tree arriving through the
      merge, not a local edit to framework behaviour. Every conflict resolution in
      that commit that DID encode a local decision is under scripts/, tests/,
      CLAUDE.md and .context/ — outside the vendored tree.

  - kind: recovery
    tasks: [T-2806, T-2807, T-2811, T-2819]
    reason: >
      These ADD files that already exist upstream but were untracked here (the
      T-2814 blanket .gitignore). A re-vendor restores them from upstream, so
      erasure costs nothing. They are recovery of our own tracking, not a change
      to framework behaviour.

      T-2819 (0bd97f38a) is the same kind with a different cause. `.gitignore:37`
      blanket-ignores `.agentic-framework/*` and re-includes a FIXED allowlist
      generated from `git ls-files` at a point in time, so any directory upstream
      adds later is dropped silently on every vendor event. `tools/` (30 files,
      including the corpus_*.py that bin/fw:4901/4907/4909 exec directly),
      `vendor/` and `status-transitions.yaml` were arriving on disk and being
      discarded the same second. `git log` cannot distinguish that from "never
      vendored"; `git check-ignore` can.
  - kind: upstream-port
    tasks: [T-2418, T-2061, T-2365]
    reason: >
      Ports OF an upstream fix, or targeted re-vendors. Upstream already carries
      the change, so a full re-vendor is a no-op for them. T-2061's commit message
      records "(landed upstream)" explicitly.
  - kind: artifact
    tasks: [T-2204, T-2155]
    reason: >
      Touch .agentic-framework/ only via episodic capture or committed session
      artifacts — no behavioural change to framework code.

  - kind: mode-only
    tasks: [T-2194]
    file: .agentic-framework/agents/audit/orchestrator-mcp-scan.sh
    reason: >
      Commit f5065d6aa ("T-2194..T-2201 ... + chmod fix") changes the file MODE
      and nothing else — `git show --numstat` reports 0 insertions, 0 deletions.
      No framework behaviour was modified locally.
    caveat: >
      A re-vendor restores UPSTREAM's mode for this file. If upstream ships it
      non-executable, the chmod is silently undone — and per PL-205 the framework's
      pre-commit gates fail OPEN on a non-executable scanner ("scanner not found
      (skipping)"). So this is the cheapest entry in the register and still not
      free. Re-check the mode after any re-vendor.
    found_by: >
      The T-2812 detector, on its first run, against a register its own author had
      just written. The task prose listed "T-2194..2201" among the artifact class
      and the register did not — which is precisely the gap between describing a
      decision and recording it.
