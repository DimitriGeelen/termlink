# Doc lint — cross-check operator-facing docs against source-of-truth.
#
# Why: identifier prose (failure-modes tables, skill recovery taxonomies,
# notify-hook env-var recipes) drifts from the real source because nothing
# tested it. Two sibling lints close that whack-a-mole at Level-C:
#
#   error-code-doc-lint  — every doc `SYMBOL(-320NN)` pairing must agree with
#                          crates/termlink-protocol/src/control.rs. A fictional
#                          CLAIM_LAPSED/CLAIM_ALREADY_HELD symbol + two mislabeled
#                          rows propagated across 5 surfaces before being caught
#                          (T-2213/T-2215/T-2216/T-2217).
#   env-var-doc-lint     — every doc-cited TERMLINK_* env var must have an
#                          implementation surface in crates/+scripts/+systemd-templates/.
#                          A copy-pasted notify-hook gating on a misnamed var
#                          (TERMLINK_SUBSTRATE_FIELD vs _CHANGE_FIELD) silently
#                          never fires; a queue-path knob (TERMLINK_OUTBOUND_QUEUE_PATH)
#                          and a producer var (TERMLINK_CV_KEY) were documented but
#                          read nowhere (T-2219/T-2220, PL-217).
#
# Fast (seconds, no Rust build) and isolated from install-check.yml /
# release.yml / the OneDev mirror job.

name: Doc Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  error-code-doc-lint:
    name: error-code symbol-number pairings match control.rs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint error-code doc pairings
        run: bash scripts/check-error-code-docs.sh

  env-var-doc-lint:
    name: doc-cited TERMLINK_* env vars have an implementation surface
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint env-var doc citations
        run: bash scripts/check-env-var-docs.sh

  # T-2686 (T-2683 F1/G1) — the whole source-level guard layer, per commit.
  #
  # Before this, the four static checks (alloc-sink, drain-sink, silent-exit,
  # busy-spin) and all ten fixture suites were invoked by NOTHING: no CI job, no
  # cron entry, no git hook, no `fw doctor` step. A tree-wide grep for them
  # returned only their own fixtures and the episodic records of the tasks that
  # created them. They were built precisely because "a convention enforced by
  # discipline is not enforced" — and then left to discipline themselves.
  #
  # This job belongs here rather than in release.yml because doc-lint runs on every
  # push and PR, needs no Rust build, and finishes in seconds. Guarding the code at
  # release time is too late; guarding it per commit is the point. (release.yml
  # gains its own copy as a last line of defence before a binary ships.)
  #
  # NOTE: the two lints above are themselves guard-layer members, so they run twice
  # on each commit. That is deliberate — they are seconds each, and keeping their
  # named checks intact avoids silently changing any branch-protection rule that
  # references them.
  guard-layer:
    name: source-level guard layer (static checks + fixture suites)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run guard layer
        run: bash scripts/run-guard-layer.sh
