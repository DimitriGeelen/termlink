# GitHub Actions workflow for TermLink releases
# Copy to: .github/workflows/release.yml in the termlink repo
#
# Builds macOS (aarch64 + x86_64) and Linux (x86_64 + aarch64) binaries.
# Triggers on version tags (e.g., v1.0.0).

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # T-2686 (T-2683 F1/G4) — the release path used to run `cargo build --release`
  # and never `cargo test`, so a regression in the workspace suite shipped straight
  # to GitHub Releases and Homebrew. T-2683 found the suite red at the time it
  # looked: `parity_topics` had been failing since 2026-08-12 (T-2624 added four
  # partial-inventory fields to the CLI's `topics --json` and never to the MCP tool)
  # with nothing to surface it, because nothing anywhere ran the tests.
  #
  # Both build jobs depend on this one, so a red suite blocks the BUILD — no binary
  # is produced at all, rather than a binary that merely fails to publish.
  #
  # This runs on tag push only (the workflow's trigger), so it costs nothing per
  # commit; a release taking longer is the correct trade for not shipping a
  # known-broken binary.
  test:
    name: Workspace test suite + guard layer
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # T-3216 / T-3233: the guard layer below includes ten members that read
          # git history; a depth-1 checkout fails all ten.
          fetch-depth: 0

      # T-3261 — a tag push checks out a detached HEAD with NO local `main`, so
      # check-task-id-collisions (base `main`) exited 2 and failed v0.12.1's release
      # (run 36633929858). The check now falls back to origin/main; this step makes
      # sure that ref exists even if the checkout action's refspec ever narrows.
      - name: Ensure origin/main is available (tag builds)
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: workspace-test

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake clang

      - name: Run workspace test suite
        run: cargo test --workspace

      # T-2684 — the source-level static checks and fixture suites. The moment code
      # becomes a release is exactly when they should run.
      # T-3260 (supersedes T-3258's two classes) — three tiers: FAIL members gate the
      # build; WARN members (`# guard-layer: source warn  # <reason>`) run, are printed
      # and annotated (::warning::), and escalate via the release-publication canary
      # after 14 days red, but cannot hold a release hostage; INFO is printed only.
      # Push CI (doc-lint.yml) gates the same way. `cargo test` above is always FAIL.
      - name: Run source-level guard layer
        run: bash scripts/run-guard-layer.sh --gate release

  # T-2692 (T-2690 F1/G1) — macOS is a FIRST-CLASS, DOCUMENTED platform that has
  # never executed a test.
  #
  # README §Platform Support asserts `Yes` for macOS five times (core binary, PTY
  # operations, Terminal.app spawn, tmux spawn, TCP hub) and names Homebrew the
  # *recommended* macOS install. `build-macos` below cross-compiles two Darwin
  # targets and publishes them to GitHub Releases, from which the Homebrew formula
  # downloads. But every `runs-on` in this repo is `ubuntu-latest` except that build
  # matrix — so the workspace suite has never once run against a macOS build, and
  # T-2690 found at least one path (`whoami`'s /proc-based PID-ancestor walk) that
  # silently degrades there. This is the "built ≠ verified" class, with a public
  # promise and a package manager attached.
  #
  # DELIBERATELY NON-BLOCKING ON FIRST LANDING. The macOS result is genuinely
  # UNKNOWN — it has never been measured, and the author of this job could not
  # execute macOS. Gating releases on an unmeasured suite would violate T-2686's own
  # acceptance criterion ("the gate is only added once the suite is actually green")
  # and could break releases on an assumption. Making the answer visible comes first;
  # a red result here is the most valuable output this job can produce.
  #
  # PROMOTED TO BLOCKING (T-3271, 2026-09-30). The first measured run was RED on
  # v0.12.3 (run 36647795849): an MCP test asserted /proc unconditionally (fixed in
  # T-3266). The first GREEN run was v0.12.4 (run 36719281724). It has now been
  # measured, so it gates the builds like the Linux suite: a red macOS suite means no
  # binary is produced, instead of a macOS break shipping silently behind a green
  # release, which is how T-3265/T-3266 went unseen.
  test-macos:
    name: Workspace test suite (macOS)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: workspace-test-macos

      # Same command as the Linux job on purpose. A reduced macOS subset would
      # recreate the "verified in name only" problem this job exists to fix.
      - name: Run workspace test suite
        run: cargo test --workspace

  build-macos:
    needs: [test, test-macos]
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14  # M1/M2/M3 runner
            artifact: termlink-darwin-aarch64
          - target: x86_64-apple-darwin
            os: macos-14  # Cross-compile for Intel on ARM runner (macos-13 deprecated)
            artifact: termlink-darwin-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install build dependencies
        run: brew install cmake

      - name: Build
        run: |
          rustc --version
          cargo build --release --target ${{ matrix.target }} -p termlink
          mkdir -p dist
          cp target/${{ matrix.target }}/release/termlink dist/${{ matrix.artifact }}
          chmod +x dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  build-linux:
    needs: [test, test-macos]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: termlink-linux-x86_64
          - target: x86_64-unknown-linux-musl
            artifact: termlink-linux-x86_64-static
          - target: aarch64-unknown-linux-gnu
            artifact: termlink-linux-aarch64

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install build dependencies (x86_64 gnu)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y cmake clang

      - name: Install build dependencies (x86_64 musl)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y cmake clang musl-tools

      - name: Install build dependencies (aarch64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build
        run: |
          rustc --version
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
          fi
          cargo build --release --target ${{ matrix.target }} -p termlink
          mkdir -p dist
          cp target/${{ matrix.target }}/release/termlink dist/${{ matrix.artifact }}
          chmod +x dist/${{ matrix.artifact }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: [build-macos, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create checksums
        run: |
          cd dist
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            dist/termlink-darwin-aarch64
            dist/termlink-darwin-x86_64
            dist/termlink-linux-x86_64
            dist/termlink-linux-x86_64-static
            dist/termlink-linux-aarch64
            dist/checksums.txt
          generate_release_notes: true
